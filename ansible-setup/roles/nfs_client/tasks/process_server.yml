---
# Обработка отдельного сервера и его дисков

# Очистка старых монтирований и fstab для текущего сервера
- name: Clean stale NFS mounts for server {{ server_item.server }}
  shell: "umount -f -l {{ nfs_mount_base }}/{{ server_item.server }}/{{ item.mountpoint }} 2>/dev/null || true"
  with_items: "{{ server_item.disks }}"
  ignore_errors: yes
  
- name: Clean up previous NFS entries in fstab for server {{ server_item.server }}
  lineinfile:
    path: /etc/fstab
    regexp: '.*{{ server_item.server_ip }}:{{ nfs_mount_base }}/{{ item.mountpoint }}.*'
    state: absent
  with_items: "{{ server_item.disks }}"

# Проверка доступности экспортов с сервера
- name: Check available NFS exports from {{ server_item.server }}
  shell: "showmount -e {{ server_item.server_ip }}"
  register: remote_exports
  retries: 5
  delay: 5
  until: remote_exports.rc == 0
  ignore_errors: yes
  
- name: Display remote exports from {{ server_item.server }}
  debug:
    msg: "Remote NFS exports from {{ server_item.server }}: {{ remote_exports.stdout_lines | default(['No exports visible']) }}"
  
# Создаем точки монтирования для дисков этого сервера
- name: Create mount points for NFS shares from {{ server_item.server }}
  file:
    path: "{{ nfs_mount_base }}/{{ server_item.server }}/{{ item.mountpoint }}"
    state: directory
    mode: '0777'
    owner: root
    group: root
  with_items: "{{ server_item.disks }}"
  
# Монтируем диски с сервера
- name: Mount NFS shares from {{ server_item.server }}
  mount:
    path: "{{ nfs_mount_base }}/{{ server_item.server }}/{{ item.mountpoint }}"
    src: "{{ server_item.server_ip }}:{{ nfs_mount_base }}/{{ item.mountpoint }}"
    fstype: nfs
    opts: "vers=3,soft,nolock,rsize=8192,wsize=8192,nofail"
    state: mounted
  with_items: "{{ server_item.disks }}"
  register: nfs_mount_result
  retries: 3
  delay: 5
  until: nfs_mount_result is succeeded
  ignore_errors: yes
  
# Настраиваем fstab для дисков сервера
- name: Configure fstab for persistent NFS mounts from {{ server_item.server }}
  lineinfile:
    path: /etc/fstab
    regexp: ".*{{ nfs_mount_base }}/{{ server_item.server }}/{{ item.mountpoint }}.*"
    line: "{{ server_item.server_ip }}:{{ nfs_mount_base }}/{{ item.mountpoint }} {{ nfs_mount_base }}/{{ server_item.server }}/{{ item.mountpoint }} nfs vers=3,soft,nolock,rsize=8192,wsize=8192,nofail 0 0"
    state: present
    backup: yes
  with_items: "{{ server_item.disks }}"