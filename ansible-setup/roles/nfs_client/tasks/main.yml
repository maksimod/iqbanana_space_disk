---
# Настройка и монтирование NFS клиента

# Предварительная проверка и размаскирование сервисов
- name: Unmask NFS services if masked
  systemd:
    name: "{{ item }}"
    masked: no
  with_items:
    - nfs-common
    - rpcbind
  ignore_errors: yes

# Установка NFS клиента
- name: Install NFS client packages
  package:
    name: 
      - nfs-common
      - ntfs-3g
      - portmap
      - nfs4-acl-tools
    state: present
  register: nfs_client_install
  retries: 3
  delay: 5
  until: nfs_client_install is succeeded

# Принудительное использование серверов из inventory с их IP-адресами
- name: Set fact for server IPs
  set_fact:
    server_ips: "{{ server_ips | default({}) | combine({item: hostvars[item]['nfs_server_ip'] | default(item)}) }}"
  with_items: "{{ groups['nfs_servers'] }}"

- name: Display servers info
  debug:
    msg: "NFS серверы: {{ server_ips }}"

# Перезапуск клиентских сервисов для гарантии работы
- name: Restart NFS client services
  systemd:
    name: "{{ item }}"
    state: restarted
    enabled: yes
  with_items:
    - rpcbind
  ignore_errors: yes

# Проверка, работает ли nfs-common после размаскирования
- name: Check if nfs-common service exists and is not masked
  shell: "systemctl status nfs-common 2>&1 | grep -q 'masked'"
  register: nfs_common_masked
  failed_when: false
  changed_when: false

# Только размаскируем, не пытаемся запустить, если служба замаскирована
- name: Unmask nfs-common if masked
  systemd:
    name: nfs-common
    masked: no
  when: nfs_common_masked.rc == 0
  ignore_errors: yes

# Оптимизация параметров ядра для NFS
- name: Optimize kernel parameters for NFS
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: yes
    reload: yes
  with_items:
    - { key: "sunrpc.tcp_slot_table_entries", value: "128" }
    - { key: "net.core.rmem_default", value: "4194304" }
    - { key: "net.core.wmem_default", value: "4194304" }
    - { key: "net.core.rmem_max", value: "16777216" }
    - { key: "net.core.wmem_max", value: "16777216" }
  ignore_errors: yes

# Проверка доступности каждого NFS сервера
- name: Check network connectivity to NFS servers
  wait_for:
    host: "{{ server_ips[item] }}"
    port: 2049
    timeout: "{{ nfs_mount_timeout | default(30) }}"
  register: nfs_network_checks
  retries: 3
  delay: 5
  until: nfs_network_checks is succeeded
  ignore_errors: yes
  with_items: "{{ groups['nfs_servers'] }}"

- name: Display network connectivity status for each server
  debug:
    msg: "{{ 'SUCCESS: NFS server ' + item.item + ' is reachable' if item is succeeded else 'WARNING: Cannot reach NFS server ' + item.item }}"
  with_items: "{{ nfs_network_checks.results }}"

# Создание базовой директории
- name: Create base storage directory
  file:
    path: "{{ nfs_mount_base }}"
    state: directory
    mode: '0777'
    owner: root
    group: root

# Добавляем задачу для очистки кэша дескрипторов файлов NFS
- name: Clear NFS file handle cache
  shell: |
    echo 'Clearing NFS cache and stale file handles...'
    service nfs-common restart || true
    service rpcbind restart || true
    sleep 2
    rm -f /var/lib/nfs/state || true
    service nfs-common restart || true
    echo 'NFS cache cleared'
  ignore_errors: yes

# Создание каталогов для каждого сервера
- name: Create server directories
  file:
    path: "{{ nfs_mount_base }}/{{ item }}"
    state: directory
    mode: '0777'
    owner: root
    group: root
  with_items: "{{ groups['nfs_servers'] }}"

# Обработка каждого сервера
- name: Process servers
  include_tasks: process_server.yml
  with_items: "{{ all_storage_disks }}"
  loop_control:
    loop_var: server_item
  when: all_storage_disks | length > 0

# Создаем скрипт автоматического монтирования для повышения надежности
- name: Create automatic mount script for multiple servers
  copy:
    dest: /usr/local/bin/nfs-automount.sh
    mode: '0755'
    content: |
      #!/bin/bash
      # Скрипт для автоматического монтирования NFS с опцией nofail для всех серверов
      
      MOUNT_OPTS="vers=3,soft,nolock,rsize=8192,wsize=8192,nofail"
      
      # Список всех серверов и их IP-адресов
      declare -A SERVER_IPS
      {% for server, ip in server_ips.items() %}
      SERVER_IPS[{{ server }}]="{{ ip }}"
      {% endfor %}
      
      # Обработка каждого сервера
      for SERVER in "${!SERVER_IPS[@]}"; do
        SERVER_IP="${SERVER_IPS[$SERVER]}"
        
        echo "Проверка доступности NFS сервера $SERVER ($SERVER_IP)..."
        if nc -z -w 5 $SERVER_IP 2049; then
          echo "NFS сервер $SERVER доступен, проверяем экспорты..."
          
          # Проверяем экспорты
          EXPORTS=$(showmount -e $SERVER_IP 2>/dev/null)
          if [ $? -eq 0 ]; then
            echo "Доступные экспорты с сервера $SERVER:"
            echo "$EXPORTS"
            
            # Монтируем экспорты для этого сервера
            echo "Монтирование NFS шар с сервера $SERVER..."
            grep "$SERVER_IP" /etc/fstab | while read line; do
              if [[ $line != \#* ]]; then
                # Извлекаем путь монтирования
                MOUNT_PATH=$(echo $line | awk '{print $2}')
                echo "Монтирование $MOUNT_PATH..."
                mkdir -p $MOUNT_PATH
                mount $MOUNT_PATH
              fi
            done
            
            # Проверяем результат
            echo "Статус монтирования для сервера $SERVER:"
            df -h | grep "$SERVER_IP"
          else
            echo "Не удалось получить список экспортов с сервера $SERVER"
          fi
        else
          echo "NFS сервер $SERVER ($SERVER_IP) недоступен"
        fi
      done
  when: all_storage_disks | length > 0

# Создаем systemd сервис для автозапуска скрипта
- name: Create systemd service for NFS automount
  copy:
    dest: /etc/systemd/system/nfs-automount.service
    mode: '0644'
    content: |
      [Unit]
      Description=NFS Auto-mount Service
      After=network-online.target
      Wants=network-online.target
      
      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/nfs-automount.sh
      RemainAfterExit=yes
      
      [Install]
      WantedBy=multi-user.target
  when: all_storage_disks | length > 0

# Активируем сервис
- name: Enable NFS automount service
  systemd:
    name: nfs-automount
    enabled: yes
    daemon_reload: yes
  when: all_storage_disks | length > 0
  ignore_errors: yes

# Проверка успешности монтирования
- name: Verify NFS mounts for all servers
  shell: "df -h | grep -E '{{ server_ips.values() | join('|') }}'"
  register: mount_verification
  changed_when: false
  failed_when: false

- name: Display mount verification results
  debug:
    msg: "NFS mounts: {{ mount_verification.stdout_lines | default(['No NFS mounts detected']) }}"