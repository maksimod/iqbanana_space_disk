---
# Установка NFS клиента
- name: Install NFS client packages
  package:
    name: 
      - nfs-common
      - ntfs-3g
    state: present
  register: nfs_client_install
  async: 300
  poll: 0

- name: Wait for NFS client installation
  async_status:
    jid: "{{ nfs_client_install.ansible_job_id }}"
  register: nfs_client_install_result
  until: nfs_client_install_result.finished
  retries: 30
  delay: 5
  when: nfs_client_install.ansible_job_id is defined

- name: Display NFS client installation status
  debug:
    msg: "{{ 'SUCCESS: NFS client installed' if nfs_client_install is succeeded else 'ERROR: Failed to install NFS client' }}"

- name: Check network connectivity to NFS server
  wait_for:
    host: "{{ nfs_server_ip }}"
    port: 2049
    timeout: "{{ nfs_mount_timeout | default(30) }}"
  register: nfs_network_check

- name: Display network connectivity status
  debug:
    msg: "{{ 'SUCCESS: NFS server is reachable' if nfs_network_check is succeeded else 'ERROR: Cannot reach NFS server' }}"

- name: Create base storage directory
  file:
    path: "{{ nfs_mount_base }}"
    state: directory
    mode: '0777'
    owner: root
    group: root

# Unmount any existing mounts
- name: Unmount existing NFS shares
  mount:
    path: "{{ nfs_mount_base }}/{{ item.mountpoint }}"
    state: unmounted
  with_items: "{{ storage_disks }}"
  ignore_errors: yes
  async: 60
  poll: 0

- name: Wait for unmount operations
  wait_for:
    timeout: 2
  delegate_to: localhost

# Создаем точки монтирования
- name: Create mount points for NFS shares in parallel
  file:
    path: "{{ nfs_mount_base }}/{{ item.mountpoint }}"
    state: directory
    mode: '0777'
    owner: root
    group: root
  with_items: "{{ storage_disks }}"
  async: 60
  poll: 0

- name: Wait for directory creation
  wait_for:
    timeout: 1
  delegate_to: localhost

# Check available exports
- name: Show available NFS exports
  shell: "showmount -e {{ nfs_server_ip }} || echo 'No exports found'"
  register: nfs_exports
  changed_when: false
  ignore_errors: yes
  retries: 3
  delay: 2
  until: "'No exports found' not in nfs_exports.stdout"

- name: Display available exports
  debug:
    msg: "Available exports: {{ nfs_exports.stdout_lines }}"

# Монтируем NFS шары параллельно
- name: Mount NFS shares in parallel
  shell: "mkdir -p {{ nfs_mount_base }}/{{ item.mountpoint }} && mount -t nfs -o {{ nfs_client_mount_opts }} {{ nfs_server_ip }}:{{ nfs_mount_base }}/{{ item.mountpoint }} {{ nfs_mount_base }}/{{ item.mountpoint }}"
  with_items: "{{ storage_disks }}"
  register: nfs_mount_result
  retries: "{{ nfs_mount_retries | default(3) }}"
  delay: "{{ nfs_mount_delay | default(2) }}"
  until: nfs_mount_result is success
  ignore_errors: yes
  async: 120
  poll: 0

- name: Wait for mount operations to complete
  wait_for:
    timeout: 3
  delegate_to: localhost

# Проверяем монтирование
- name: Verify NFS mounts
  shell: "df -h | grep {{ nfs_server_ip }} || echo 'No mounts found'"
  register: mount_verification
  changed_when: false

- name: Display verification status
  debug:
    msg: "Mounts found: {{ mount_verification.stdout_lines }}"

# Проверка прав на запись
- name: Test write permissions in parallel
  shell: "touch {{ nfs_mount_base }}/{{ item.mountpoint }}/test_write_permissions.txt && echo 'OK' || echo 'Failed'"
  with_items: "{{ storage_disks }}"
  register: write_test
  ignore_errors: yes
  async: 60
  poll: 0

- name: Wait for write test operations to complete
  async_status:
    jid: "{{ item.ansible_job_id }}"
  register: write_test_results
  until: write_test_results.finished
  retries: 10
  delay: 2
  with_items: "{{ write_test.results }}"
  when: write_test.results is defined
  
- name: Display write permissions test results
  debug:
    msg: "Write test on {{ item.item.item.mountpoint }}: {{ item.stdout }}"
  with_items: "{{ write_test_results.results | default([]) }}"
  when: write_test_results.results is defined

# Обновление конфигурации backend для корректной работы с монтированными дисками
- name: Create backend config directory if it doesn't exist
  file:
    path: "{{ backend_config_path | default('/home/client/iqbanana_space_disk/backend/config') }}"
    state: directory
    mode: '0755'
  ignore_errors: yes

- name: Generate disk config for backend
  template:
    src: backend_config.js.j2
    dest: "{{ backend_config_path | default('/home/client/iqbanana_space_disk/backend/config') }}/config.js"
    mode: '0644'
  register: backend_config_update

- name: Display backend configuration update status
  debug:
    msg: "{{ 'SUCCESS: Backend configuration updated' if backend_config_update is succeeded else 'ERROR: Failed to update backend configuration' }}"