---
# Установка NFS клиента
- name: Install NFS client packages
  package:
    name: nfs-common
    state: present
  register: nfs_client_install

- name: Display NFS client installation status
  debug:
    msg: "{{ 'SUCCESS: NFS client installed' if nfs_client_install is succeeded else 'ERROR: Failed to install NFS client' }}"

# Получаем список экспортированных шар
- name: Get server's shared partitions
  shell: "showmount -e {{ nfs_server_ip }}"
  register: nfs_shares_available
  changed_when: false

- name: Display available NFS shares
  debug:
    msg: "Available NFS shares: {{ nfs_shares_available.stdout_lines | default(['None']) }}"

# Создаем точки монтирования
- name: Ensure mount points exist
  file:
    path: "{{ nfs_mount_base }}/{{ item.split()[-1] | basename }}"
    state: directory
    mode: '0755'
  with_items: "{{ nfs_shares_available.stdout_lines[1:] }}"
  when: nfs_shares_available.stdout_lines is defined and nfs_shares_available.stdout_lines | length > 1

# Монтируем NFS шары
- name: Mount NFS shares
  mount:
    path: "{{ nfs_mount_base }}/{{ item.split()[-1] | basename }}"
    src: "{{ nfs_server_ip }}:{{ item.split()[-1] }}"
    fstype: nfs
    opts: rw,sync
    state: mounted
  with_items: "{{ nfs_shares_available.stdout_lines[1:] }}"
  when: nfs_shares_available.stdout_lines is defined and nfs_shares_available.stdout_lines | length > 1
  register: nfs_mount_result

- name: Display mount status
  debug:
    msg: "{{ 'SUCCESS: NFS shares mounted' if nfs_mount_result is succeeded else 'ERROR: Failed to mount NFS shares' }}"

# Проверяем монтирование
- name: Verify NFS mounts
  shell: "df -h | grep {{ nfs_server_ip }}"
  register: mount_verification
  changed_when: false

- name: Display verification status
  debug:
    msg: "{{ 'SUCCESS: NFS mounts verified' if mount_verification is succeeded else 'ERROR: NFS mounts not found' }}"