---
# Настройка и монтирование NFS клиента

# Предварительная проверка и размаскирование сервисов
- name: Unmask NFS services if masked
  systemd:
    name: "{{ item }}"
    masked: no
  with_items:
    - nfs-common
    - rpcbind
  ignore_errors: yes

# Установка NFS клиента
- name: Install NFS client packages
  package:
    name: 
      - nfs-common
      - ntfs-3g
      - portmap
      - nfs4-acl-tools
    state: present
  register: nfs_client_install
  retries: 3
  delay: 5
  until: nfs_client_install is succeeded

- name: Display NFS client installation status
  debug:
    msg: "{{ 'SUCCESS: NFS client installed' if nfs_client_install is succeeded else 'ERROR: Failed to install NFS client' }}"

# Перезапуск клиентских сервисов для гарантии работы
- name: Restart NFS client services
  systemd:
    name: "{{ item }}"
    state: restarted
    enabled: yes
  with_items:
    - rpcbind
  ignore_errors: yes

# Проверка, работает ли nfs-common после размаскирования
- name: Check if nfs-common service exists and is not masked
  shell: "systemctl status nfs-common 2>&1 | grep -q 'masked'"
  register: nfs_common_masked
  failed_when: false
  changed_when: false
  
# Только размаскируем, не пытаемся запустить, если служба замаскирована
- name: Unmask nfs-common if masked
  systemd:
    name: nfs-common
    masked: no
  when: nfs_common_masked.rc == 0
  ignore_errors: yes

# Оптимизация параметров ядра для NFS
- name: Optimize kernel parameters for NFS
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: yes
    reload: yes
  with_items:
    - { key: "sunrpc.tcp_slot_table_entries", value: "128" }
    - { key: "net.core.rmem_default", value: "262144" }
    - { key: "net.core.wmem_default", value: "262144" }
    - { key: "net.core.rmem_max", value: "16777216" }
    - { key: "net.core.wmem_max", value: "16777216" }
    - { key: "vm.dirty_ratio", value: "80" }
    - { key: "vm.dirty_background_ratio", value: "5" }
    - { key: "vm.dirty_expire_centisecs", value: "12000" }
  ignore_errors: yes

# Проверка доступности NFS сервера
- name: Check network connectivity to NFS server
  wait_for:
    host: "{{ nfs_server_ip }}"
    port: 2049
    timeout: "{{ nfs_mount_timeout | default(30) }}"
  register: nfs_network_check
  retries: 3
  delay: 5
  until: nfs_network_check is succeeded
  ignore_errors: yes

- name: Display network connectivity status
  debug:
    msg: "{{ 'SUCCESS: NFS server is reachable' if nfs_network_check is succeeded else 'WARNING: Cannot reach NFS server' }}"

# Создание базовой директории
- name: Create base storage directory
  file:
    path: "{{ nfs_mount_base }}"
    state: directory
    mode: '0777'
    owner: root
    group: root

# Очистка устаревших NFS монтирований
- name: Clean stale NFS mounts
  shell: "umount -f -l {{ nfs_mount_base }}/{{ item.mountpoint }} 2>/dev/null || true"
  with_items: "{{ hostvars[groups['nfs_server'][0]]['storage_disks'] | default([]) }}"
  ignore_errors: yes
  when: hostvars[groups['nfs_server'][0]]['storage_disks'] is defined and hostvars[groups['nfs_server'][0]]['storage_disks'] | length > 0

# Проверка доступности экспортов
- name: Wait for NFS exports to be available
  shell: "showmount -e {{ nfs_server_ip }}"
  register: remote_exports
  retries: 5
  delay: 5
  until: remote_exports.rc == 0
  ignore_errors: yes

- name: Display remote exports
  debug:
    msg: "Remote NFS exports: {{ remote_exports.stdout_lines | default(['No exports visible']) }}"

# Создание точек монтирования
- name: Create mount points for NFS shares
  file:
    path: "{{ nfs_mount_base }}/{{ item.mountpoint }}"
    state: directory
    mode: '0777'
    owner: root
    group: root
  with_items: "{{ hostvars[groups['nfs_server'][0]]['storage_disks'] | default([]) }}"
  when: hostvars[groups['nfs_server'][0]]['storage_disks'] is defined and hostvars[groups['nfs_server'][0]]['storage_disks'] | length > 0

# Монтирование NFS с оптимальными параметрами
- name: Mount NFS shares with optimized parameters
  mount:
    path: "{{ nfs_mount_base }}/{{ item.mountpoint }}"
    src: "{{ nfs_server_ip }}:{{ nfs_mount_base }}/{{ item.mountpoint }}"
    fstype: nfs
    opts: "rw,soft,timeo=10,retrans=2,noatime,_netdev,rsize=1048576,wsize=1048576,nconnect=16,lookupcache=positive,fsc,actimeo=600,nolock,local_lock=none,tcp"
    state: mounted
  with_items: "{{ hostvars[groups['nfs_server'][0]]['storage_disks'] | default([]) }}"
  register: nfs_mount_result
  retries: "{{ nfs_mount_retries | default(5) }}"
  delay: "{{ nfs_mount_delay | default(10) }}"
  until: nfs_mount_result is succeeded
  ignore_errors: yes
  when: hostvars[groups['nfs_server'][0]]['storage_disks'] is defined and hostvars[groups['nfs_server'][0]]['storage_disks'] | length > 0

# Проверка успешности монтирования
- name: Verify NFS mounts
  shell: "df -h | grep -E '{{ nfs_server_ip }}|nfs' || echo 'No NFS mounts detected'"
  register: mount_verification
  changed_when: false
  failed_when: false

- name: Display mount verification results
  debug:
    msg: "NFS mounts: {{ mount_verification.stdout_lines | default(['No NFS mounts detected']) }}"

# Установка прав доступа для всех примонтированных NFS директорий
- name: Ensure proper permissions for NFS mounts
  file:
    path: "{{ nfs_mount_base }}/{{ item.mountpoint }}"
    state: directory
    mode: '0777'
    recurse: yes
  with_items: "{{ hostvars[groups['nfs_server'][0]]['storage_disks'] | default([]) }}"
  ignore_errors: yes
  when: 
    - hostvars[groups['nfs_server'][0]]['storage_disks'] is defined
    - hostvars[groups['nfs_server'][0]]['storage_disks'] | length > 0
    - mount_verification.rc == 0
    - "'No NFS mounts detected' not in mount_verification.stdout"

# Проверка прав на запись (только если есть монтирования)
- name: Test write permissions if mounted
  shell: "touch {{ nfs_mount_base }}/{{ item.mountpoint }}/ansible_write_test_{{ ansible_date_time.epoch }}.txt && echo OK || echo FAILED"
  register: write_test_results
  with_items: "{{ hostvars[groups['nfs_server'][0]]['storage_disks'] | default([]) }}"
  ignore_errors: yes
  when: 
    - hostvars[groups['nfs_server'][0]]['storage_disks'] is defined
    - hostvars[groups['nfs_server'][0]]['storage_disks'] | length > 0 
    - mount_verification.rc == 0
    - "'No NFS mounts detected' not in mount_verification.stdout"

# Отображение результатов теста записи
- name: Display write test results
  debug:
    msg: "Write test for {{ item.item.mountpoint }}: {{ item.stdout | default('Test not performed') }}"
  with_items: "{{ write_test_results.results | default([]) }}"
  when: write_test_results is defined and write_test_results.results is defined

# Очистка временных файлов
- name: Clean up test files
  file:
    path: "{{ nfs_mount_base }}/{{ item.item.mountpoint }}/ansible_write_test_{{ ansible_date_time.epoch }}.txt"
    state: absent
  with_items: "{{ write_test_results.results | default([]) }}"
  ignore_errors: yes
  when: write_test_results is defined and write_test_results.results is defined and item.stdout is defined and item.stdout == "OK"

# Создание полной директории для конфигурации backend, включая родительские каталоги
- name: Ensure backend config directory exists with parents
  file:
    path: "{{ backend_config_path | dirname }}/config"
    state: directory
    mode: '0755'
    recurse: yes
  ignore_errors: yes
  when: backend_config_path is defined

# Генерация и установка нового config.js на основе смонтированных дисков
- name: Generate and install backend config
  template:
    src: backend_config.js.j2
    dest: "{{ backend_config_path }}/config.js"
    mode: '0644'
    force: yes
  when: 
    - backend_config_path is defined
    - hostvars[groups['nfs_server'][0]]['storage_disks'] is defined
    - hostvars[groups['nfs_server'][0]]['storage_disks'] | length > 0
  register: config_updated
  ignore_errors: no

- name: Display config update status
  debug:
    msg: "Backend configuration {{ 'updated successfully' if config_updated is succeeded else 'failed to update' }}"
  when: backend_config_path is defined

# Дополнительно: убедимся, что backend модуль может быть запущен с правильными правами
- name: Ensure backend has proper permissions
  file:
    path: "{{ backend_config_path | dirname }}"
    state: directory
    mode: '0755'
    recurse: yes
    owner: "{{ 'client' if ansible_user == 'client' else ansible_user }}"
    group: "{{ 'client' if ansible_user == 'client' else ansible_user }}"
  ignore_errors: yes
  when: backend_config_path is defined

- name: Execute update backend config script
  shell: |
    cat > /tmp/update-backend-config.sh << 'EOL'
    #!/bin/bash
    CONFIG_FILE="/home/user/iqbanana_space_disk/backend/config/config.js"
    MOUNTED_DISKS=$(df -h | grep "/mnt/storage/" | awk '{print $1, $6}')
    
    echo "Обновление конфигурации backend..."
    TMP_CONFIG=$(mktemp)
    
    cat > "$TMP_CONFIG" << 'EOF'
    // Конфигурация приложения
    const config = {
      // Базовые настройки
      server: {
        port: process.env.PORT || 6005,
        allowedOrigins: [
          'http://46.35.241.37:6001', 
          'http://localhost:6001',
          'https://iqbanana.online',
          'http://iqbanana.online'
        ]
      },
      
      // Версия API
      apiVersion: 'v1',
      
      // Пути к смонтированным дискам на веб-сервере
      disks: {
    EOF
    
    while read -r line; do
      if [[ $line =~ /mnt/storage/([a-zA-Z0-9]+) ]]; then
        disk_name=${BASH_REMATCH[1]}
        disk_path="/mnt/storage/$disk_name"
        echo "    'disk_$disk_name': '$disk_path'," >> "$TMP_CONFIG"
      fi
    done <<< "$MOUNTED_DISKS"
    
    cat >> "$TMP_CONFIG" << 'EOF'
      },
      
      // Настройки производительности для файловых операций
      performance: {
        chunkSize: 8 * 1024 * 1024,
        concurrentUploads: 4,
        maxFileSize: 10 * 1024 * 1024 * 1024
      }
    };
    
    module.exports = config;
    EOF
    
    if [ -f "$CONFIG_FILE" ]; then
      cp "$CONFIG_FILE" "${CONFIG_FILE}.backup.$(date +%s)"
    fi
    
    cp "$TMP_CONFIG" "$CONFIG_FILE"
    chmod 644 "$CONFIG_FILE"
    rm "$TMP_CONFIG"
    EOL
    
    chmod +x /tmp/update-backend-config.sh
    /tmp/update-backend-config.sh
  args:
    executable: /bin/bash
  register: update_script_result
  
- name: Display update script result
  debug:
    msg: "{{ update_script_result.stdout_lines }}"