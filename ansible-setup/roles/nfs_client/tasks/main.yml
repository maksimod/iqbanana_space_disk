---
# Настройка и монтирование NFS клиента

# Предварительная проверка и размаскирование сервисов
- name: Unmask NFS services if masked
  systemd:
    name: "{{ item }}"
    masked: no
  with_items:
    - nfs-common
    - rpcbind
  ignore_errors: yes

# Установка NFS клиента
- name: Install NFS client packages
  package:
    name: 
      - nfs-common
      - ntfs-3g
      - portmap
      - nfs4-acl-tools
    state: present
  register: nfs_client_install
  retries: 3
  delay: 5
  until: nfs_client_install is succeeded

# Принудительное использование сервера из inventory
- name: Get NFS server from inventory
  set_fact:
    active_nfs_server_ip: "{{ groups['nfs_server'][0] }}"
    cacheable: yes

- name: Display server IP
  debug:
    msg: "Используем NFS сервер из inventory: {{ active_nfs_server_ip }}"

# Перезапуск клиентских сервисов для гарантии работы
- name: Restart NFS client services
  systemd:
    name: "{{ item }}"
    state: restarted
    enabled: yes
  with_items:
    - rpcbind
  ignore_errors: yes

# Оптимизация параметров ядра для NFS
- name: Optimize kernel parameters for NFS
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: yes
    reload: yes
  with_items:
    - { key: "sunrpc.tcp_slot_table_entries", value: "128" }
    - { key: "net.core.rmem_default", value: "4194304" }
    - { key: "net.core.wmem_default", value: "4194304" }
    - { key: "net.core.rmem_max", value: "16777216" }
    - { key: "net.core.wmem_max", value: "16777216" }
  ignore_errors: yes

# Проверка доступности NFS сервера
- name: Check network connectivity to NFS server
  wait_for:
    host: "{{ active_nfs_server_ip }}"
    port: 2049
    timeout: "{{ nfs_mount_timeout | default(30) }}"
  register: nfs_network_check
  retries: 3
  delay: 5
  until: nfs_network_check is succeeded
  ignore_errors: yes

- name: Display network connectivity status
  debug:
    msg: "{{ 'SUCCESS: NFS server is reachable' if nfs_network_check is succeeded else 'WARNING: Cannot reach NFS server' }}"

# Создание базовой директории
- name: Create base storage directory
  file:
    path: "{{ nfs_mount_base }}"
    state: directory
    mode: '0777'
    owner: root
    group: root

# Проверка доступности экспортов
- name: Check available NFS exports
  shell: "showmount -e {{ active_nfs_server_ip }}"
  register: remote_exports
  retries: 5
  delay: 5
  until: remote_exports.rc == 0
  ignore_errors: yes

- name: Display remote exports
  debug:
    msg: "Remote NFS exports: {{ remote_exports.stdout_lines | default(['No exports visible']) }}"

# Очистка существующих записей fstab для NFS
- name: Clean up previous NFS entries in fstab
  lineinfile:
    path: /etc/fstab
    regexp: '.*{{ active_nfs_server_ip }}:{{ nfs_mount_base }}/{{ item.mountpoint }}.*'
    state: absent
  with_items: "{{ hostvars[groups['nfs_server'][0]]['storage_disks'] | default([]) }}"
  when: hostvars[groups['nfs_server'][0]]['storage_disks'] is defined and hostvars[groups['nfs_server'][0]]['storage_disks'] | length > 0

# Создание точек монтирования
- name: Create mount points for NFS shares
  file:
    path: "{{ nfs_mount_base }}/{{ item.mountpoint }}"
    state: directory
    mode: '0777'
    owner: root
    group: root
  with_items: "{{ hostvars[groups['nfs_server'][0]]['storage_disks'] | default([]) }}"
  when: hostvars[groups['nfs_server'][0]]['storage_disks'] is defined and hostvars[groups['nfs_server'][0]]['storage_disks'] | length > 0

# Размонтирование существующих NFS шар
- name: Unmount any existing NFS mounts
  shell: "umount -f -l {{ nfs_mount_base }}/{{ item.mountpoint }} 2>/dev/null || true"
  with_items: "{{ hostvars[groups['nfs_server'][0]]['storage_disks'] | default([]) }}"
  ignore_errors: yes
  when: hostvars[groups['nfs_server'][0]]['storage_disks'] is defined and hostvars[groups['nfs_server'][0]]['storage_disks'] | length > 0

# Монтирование NFS шар с оптимальными параметрами
- name: Mount NFS shares with optimized parameters
  mount:
    path: "{{ nfs_mount_base }}/{{ item.mountpoint }}"
    src: "{{ active_nfs_server_ip }}:{{ nfs_mount_base }}/{{ item.mountpoint }}"
    fstype: nfs
    opts: "vers=3,soft,nolock,rsize=8192,wsize=8192,nofail"
    state: mounted
  with_items: "{{ hostvars[groups['nfs_server'][0]]['storage_disks'] | default([]) }}"
  register: nfs_mount_result
  retries: 3
  delay: 5
  until: nfs_mount_result is succeeded
  ignore_errors: yes
  when: hostvars[groups['nfs_server'][0]]['storage_disks'] is defined and hostvars[groups['nfs_server'][0]]['storage_disks'] | length > 0

# Настраиваем fstab для NFS монтирований
- name: Configure fstab for persistent NFS mounts
  lineinfile:
    path: /etc/fstab
    regexp: ".*{{ nfs_mount_base }}/{{ item.mountpoint }}.*"
    line: "{{ active_nfs_server_ip }}:{{ nfs_mount_base }}/{{ item.mountpoint }} {{ nfs_mount_base }}/{{ item.mountpoint }} nfs vers=3,soft,nolock,rsize=8192,wsize=8192,nofail 0 0"
    state: present
    backup: yes
  with_items: "{{ hostvars[groups['nfs_server'][0]]['storage_disks'] | default([]) }}"
  when: hostvars[groups['nfs_server'][0]]['storage_disks'] is defined and hostvars[groups['nfs_server'][0]]['storage_disks'] | length > 0

# Проверка успешности монтирования
- name: Verify NFS mounts
  shell: "df -h | grep {{ active_nfs_server_ip }}:{{ nfs_mount_base }}"
  register: mount_verification
  changed_when: false
  failed_when: false

- name: Display mount verification results
  debug:
    msg: "NFS mounts: {{ mount_verification.stdout_lines | default(['No NFS mounts detected']) }}"