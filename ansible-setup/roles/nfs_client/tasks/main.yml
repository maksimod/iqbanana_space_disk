---
# Устанавливаем переменную для контроля async операций
- name: Set default for role_disable_async if not defined
  set_fact:
    role_disable_async: "{{ role_disable_async | default(false) }}"

# Установка NFS клиента без асинхронности
- name: Install NFS client packages
  package:
    name: 
      - nfs-common
      - ntfs-3g
    state: present
  register: nfs_client_install

- name: Display NFS client installation status
  debug:
    msg: "{{ 'SUCCESS: NFS client installed' if nfs_client_install is succeeded else 'ERROR: Failed to install NFS client' }}"

- name: Check network connectivity to NFS server
  wait_for:
    host: "{{ nfs_server_ip }}"
    port: 2049
    timeout: "{{ nfs_mount_timeout | default(30) }}"
  register: nfs_network_check
  failed_when: nfs_network_check is failed

- name: Display network connectivity status
  debug:
    msg: "{{ 'SUCCESS: NFS server is reachable' if nfs_network_check is succeeded else 'ERROR: Cannot reach NFS server' }}"

- name: Create base storage directory
  file:
    path: "{{ nfs_mount_base }}"
    state: directory
    mode: '0777'
    owner: root
    group: root

# Безопасная проверка монтирования
- name: Check if NFS shares are already mounted
  shell: "df -h | grep {{ nfs_server_ip }}"
  register: existing_mounts
  changed_when: false
  failed_when: false

# Размонтируем только если диски уже примонтированы
- name: Unmount existing NFS shares
  mount:
    path: "{{ nfs_mount_base }}/{{ item.mountpoint }}"
    state: unmounted
  with_items: "{{ storage_disks }}"
  when: existing_mounts.rc == 0
  failed_when: false

- name: Wait for unmount operations
  pause:
    seconds: 2

# Создаем точки монтирования
- name: Create mount points for NFS shares
  file:
    path: "{{ nfs_mount_base }}/{{ item.mountpoint }}"
    state: directory
    mode: '0777'
    owner: root
    group: root
  with_items: "{{ storage_disks }}"

# Check available exports перед монтированием
- name: Show available NFS exports
  shell: "showmount -e {{ nfs_server_ip }}"
  register: nfs_exports
  changed_when: false
  failed_when: false
  retries: 3
  delay: 2
  until: nfs_exports.rc == 0

- name: Display available exports
  debug:
    msg: "Available exports: {{ nfs_exports.stdout_lines }}"
  when: nfs_exports.stdout is defined

# Монтируем NFS шары последовательно и безопасно
- name: Mount NFS shares sequentially
  mount:
    path: "{{ nfs_mount_base }}/{{ item.mountpoint }}"
    src: "{{ nfs_server_ip }}:{{ nfs_mount_base }}/{{ item.mountpoint }}"
    fstype: nfs
    opts: "{{ nfs_client_mount_opts }}"
    state: mounted
  with_items: "{{ storage_disks }}"
  register: nfs_mount_result
  failed_when: false

- name: Display mount status
  debug:
    msg: "Mount status for {{ item.item.mountpoint }}: {{ 'SUCCESS' if item.changed else 'FAILED or ALREADY MOUNTED' }}"
  with_items: "{{ nfs_mount_result.results }}"

# Проверяем монтирование
- name: Verify NFS mounts
  shell: "df -h | grep {{ nfs_server_ip }}"
  register: mount_verification
  changed_when: false
  failed_when: false

- name: Display verification status
  debug:
    msg: "Mounts found: {{ mount_verification.stdout_lines | default(['No mounts found']) }}"

# Проверка прав на запись только если монтирование успешно
- name: Test write permissions sequentially
  shell: "touch {{ nfs_mount_base }}/{{ item.mountpoint }}/test_write_permissions.txt"
  with_items: "{{ storage_disks }}"
  register: write_test
  failed_when: false
  when: mount_verification.rc == 0

- name: Display write permissions test results
  debug:
    msg: "Write test on {{ item.item.mountpoint }}: {{ 'SUCCESS' if item.rc == 0 else 'FAILED' }}"
  with_items: "{{ write_test.results | default([]) }}"
  when: write_test.results is defined

# Обновление конфигурации backend для корректной работы с монтированными дисками
- name: Create backend config directory if it doesn't exist
  file:
    path: "{{ backend_config_path | default('/home/client/iqbanana_space_disk/backend/config') }}"
    state: directory
    mode: '0755'

- name: Generate disk config for backend
  template:
    src: backend_config.js.j2
    dest: "{{ backend_config_path | default('/home/client/iqbanana_space_disk/backend/config') }}/config.js"
    mode: '0644'
  register: backend_config_update

- name: Display backend configuration update status
  debug:
    msg: "{{ 'SUCCESS: Backend configuration updated' if backend_config_update is succeeded else 'ERROR: Failed to update backend configuration' }}"