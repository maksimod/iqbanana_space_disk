---
- name: Install NFS client packages
  package:
    name: nfs-common
    state: present
  register: nfs_client_install
  ignore_errors: true

- name: Display NFS client installation status
  debug:
    msg: "{{ 'SUCCESS: NFS client installed' if nfs_client_install is succeeded else 'ERROR: Failed to install NFS client' }}"

- name: Get server's shared partitions
  shell: "showmount -e {{ nfs_server_ip | default(hostvars[groups['nfs_server'][0]]['ansible_host']) }}"
  register: nfs_shares_available
  changed_when: false
  ignore_errors: true

- name: Display available NFS shares
  debug:
    msg: "Available NFS shares: {{ nfs_shares_available.stdout_lines | default(['None']) }}"

- name: Set nfs_mount_base variable if not defined
  set_fact:
    nfs_mount_base: "/mnt/nfs_client"
  when: nfs_mount_base is not defined

- name: Ensure mount base directory exists
  file:
    path: "{{ nfs_mount_base }}"
    state: directory
    mode: '0755'
  when: nfs_shares_available is defined and nfs_shares_available.stdout_lines is defined and nfs_shares_available.stdout_lines | length > 1

- name: Create mount points for NFS shares
  file:
    path: "{{ nfs_mount_base }}/{{ item.split()[-1] | basename }}"
    state: directory
    mode: '0755'
  with_items: "{{ nfs_shares_available.stdout_lines[1:] }}"
  when: nfs_shares_available is defined and nfs_shares_available.stdout_lines is defined and nfs_shares_available.stdout_lines | length > 1

- name: Mount NFS shares (without adding to fstab)
  command: "mount -t nfs {{ nfs_server_ip | default(hostvars[groups['nfs_server'][0]]['ansible_host']) }}:{{ item.split()[-1] }} {{ nfs_mount_base }}/{{ item.split()[-1] | basename }}"
  with_items: "{{ nfs_shares_available.stdout_lines[1:] }}"
  when: nfs_shares_available is defined and nfs_shares_available.stdout_lines is defined and nfs_shares_available.stdout_lines | length > 1
  register: nfs_mount_result
  ignore_errors: true

- name: Display mount status
  debug:
    msg: "{{ 'SUCCESS: NFS shares mounted' if nfs_mount_result is defined and nfs_mount_result is succeeded else 'ERROR: Failed to mount NFS shares' }}"
  when: nfs_mount_result is defined

- name: Verify NFS mounts
  shell: "df -h | grep {{ nfs_server_ip | default(hostvars[groups['nfs_server'][0]]['ansible_host']) }}"
  register: mount_verification
  changed_when: false
  ignore_errors: true

- name: Display verification status
  debug:
    msg: "{{ 'SUCCESS: NFS mounts verified' if mount_verification is defined and mount_verification is succeeded else 'ERROR: NFS mounts not found' }}"