---
# Улучшенный отчет о выполнении операций монтирования

# Получение информации о дисках на сервере
- name: Get server mounted disk information
  shell: "df -h | grep '{{ nfs_mount_base }}' || echo 'No mounted disks on server'"
  register: mount_info_server
  changed_when: false
  failed_when: false
  delegate_to: "{{ groups['nfs_server'][0] }}"

# Получение информации о смонтированных NFS на клиенте
- name: Get client mounted disk information
  shell: "df -h | grep nfs || echo 'No NFS mounts on client'"
  register: mount_info_client
  changed_when: false
  failed_when: false

# Проверка доступа к дискам
- name: Test disk access
  shell: "ls -la {{ nfs_mount_base }} || echo 'Cannot access mount directory'"
  register: disk_access
  changed_when: false
  failed_when: false

# Вычисляем время выполнения
- name: Capture current time for report
  shell: "date +%s"
  register: current_time
  changed_when: false

- name: Calculate execution time
  set_fact:
    end_time: "{{ current_time.stdout | int }}"
    start_time: "{{ ansible_date_time.epoch | int - 300 | default(ansible_date_time.epoch) }}"
  
- name: Calculate minutes and seconds
  set_fact:
    execution_time_seconds: "{{ end_time - start_time }}"
    execution_time_minutes: "{{ ((end_time - start_time) / 60) | int }}"
    execution_time_remaining_seconds: "{{ (end_time - start_time) % 60 }}"

# Создаем и выводим отчет
- name: Generate report
  set_fact:
    report_text: |
      =====================================================
      NFS MOUNTING OPERATION REPORT
      =====================================================
      
      Execution time: {{ execution_time_minutes }} min {{ execution_time_remaining_seconds }} sec
      
      SERVER MOUNTED DISKS:
      -----------------------------------------------------
      {% if mount_info_server.stdout_lines is defined and mount_info_server.stdout_lines | length > 0 %}
      {% for line in mount_info_server.stdout_lines %}
      {{ line }}
      {% endfor %}
      {% else %}
      No mounted disks on server
      {% endif %}
      
      CLIENT MOUNTED NFS SHARES:
      -----------------------------------------------------
      {% if mount_info_client.stdout_lines is defined and mount_info_client.stdout_lines | length > 0 %}
      {% for line in mount_info_client.stdout_lines %}
      {{ line }}
      {% endfor %}
      {% else %}
      No NFS mounts on client
      {% endif %}
      
      MOUNT DIRECTORY ACCESS:
      -----------------------------------------------------
      {% if disk_access.stdout_lines is defined and disk_access.stdout_lines | length > 0 %}
      {% for line in disk_access.stdout_lines | slice(0, 5) %}
      {{ line }}
      {% endfor %}
      {% if disk_access.stdout_lines | length > 5 %}
      ... and {{ disk_access.stdout_lines | length - 5 }} more items
      {% endif %}
      {% else %}
      Cannot access mount directory
      {% endif %}
      
      =====================================================
      END OF REPORT
      =====================================================

- name: Display the report
  debug:
    msg: "{{ report_text.split('\n') }}"
    verbosity: 0

- name: Export report to file
  copy:
    content: "{{ report_text }}"
    dest: "/tmp/ansible_mount_report.txt"
    mode: '0644'