---
# Отображение финального отчета о монтировании дисков и времени выполнения

- name: Get mounted disks information
  shell: "df -h | grep '{{ nfs_mount_base }}' | awk '{print $1, $2, $3, $4, $5, $6}'"
  register: mount_info
  ignore_errors: yes
  run_once: true

- name: Get script start time and calculate execution time
  block:
    - name: Get start time
      shell: "cat /tmp/ansible_start_time.txt"
      register: start_time
    
    - name: Get current time
      shell: "date +%s"
      register: end_time
    
    - name: Calculate duration
      set_fact:
        execution_seconds: "{{ (end_time.stdout|int) - (start_time.stdout|int) }}"
        execution_minutes: "{{ ((end_time.stdout|int) - (start_time.stdout|int)) // 60 }}"
        execution_remain_seconds: "{{ ((end_time.stdout|int) - (start_time.stdout|int)) % 60 }}"
  when: true
  run_once: true

- name: Generate mount report text
  set_fact:
    mount_report: "=== РЕАЛЬНО И УСПЕШНО ПРИМОНТИРОВАННЫЕ ДИСКИ ===\n{% for line in mount_info.stdout_lines | default([]) %}{{ line }}\n{% endfor %}\n\n=== ИНФОРМАЦИЯ О ВРЕМЕНИ ВЫПОЛНЕНИЯ ===\nВремя выполнения: {{ execution_minutes | default(0) }}:{{ '%02d' | format(execution_remain_seconds | default(0) |int) }} ({{ execution_minutes | default(0) }} минут {{ execution_remain_seconds | default(0) }} секунд)"
  run_once: true

- name: Show detailed report
  debug:
    msg: "{{ mount_report.split('\n') }}"
  run_once: true

- name: Cleanup report and time files
  file:
    path: "{{ item }}"
    state: absent
  with_items:
    - /tmp/ansible_mount_report.txt
    - /tmp/ansible_start_time.txt
  ignore_errors: yes
  run_once: true
  async: 60
  poll: 0 