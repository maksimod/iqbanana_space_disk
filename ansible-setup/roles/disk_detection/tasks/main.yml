---
# Улучшенный скрипт для надежного определения и монтирования несистемных разделов

# Получаем информацию о системе
- name: Gather facts
  setup:
  when: ansible_os_family is not defined

# Определяем корневой раздел
- name: Identify root partition
  shell: "findmnt -n -o SOURCE /"
  register: root_partition
  changed_when: false
  ignore_errors: yes

- name: Display root partition
  debug:
    msg: "Root partition is {{ root_partition.stdout }}"

# Определяем системные диски (содержащие корневой раздел и swap)
- name: Identify system disk from root partition
  shell: "lsblk -no pkname {{ root_partition.stdout }} 2>/dev/null || echo ''"
  register: system_disk_name
  changed_when: false
  ignore_errors: yes

- name: Get mounted partitions and swap
  shell: "cat /proc/mounts | grep -E '^/dev/[a-z]' | cut -d' ' -f1 && cat /proc/swaps | grep -v 'Filename' | grep -E '^/dev/[a-z]' | cut -d' ' -f1"
  register: system_partitions
  changed_when: false
  ignore_errors: yes

# Преобразуем разделы в диски
- name: Convert system partitions to disks
  shell: "echo {{ system_partitions.stdout_lines | join(' ') }} | xargs -n1 lsblk -no pkname 2>/dev/null | grep -v '^$' | sort | uniq"
  register: system_disks_raw
  changed_when: false
  ignore_errors: yes
  when: system_partitions.stdout_lines is defined and system_partitions.stdout_lines | length > 0

- name: Set system disks list
  set_fact:
    system_disks: "{{ system_disks_raw.stdout_lines | map('regex_replace', '^', '/dev/') | list }}"
  when: system_disks_raw is defined and system_disks_raw.stdout_lines is defined and system_disks_raw.stdout_lines | length > 0

- name: Display system disks
  debug:
    msg: "System disks: {{ system_disks | default([]) }}"

# Получаем список всех блочных устройств
- name: Find all block devices
  shell: "lsblk -dpno NAME | grep -E '^/dev/[a-z]d[a-z]$'"
  register: all_disks
  changed_when: false
  ignore_errors: yes

- name: Display all disks
  debug:
    msg: "All disks: {{ all_disks.stdout_lines | default([]) }}"

# Фильтруем несистемные диски
- name: Filter non-system disks
  set_fact:
    nonsystem_disks: "{{ all_disks.stdout_lines | difference(system_disks | default([])) }}"
  when: all_disks.stdout_lines is defined and all_disks.stdout_lines | length > 0

- name: Display non-system disks
  debug:
    msg: "Non-system disks: {{ nonsystem_disks | default([]) }}"

# Проверяем, есть ли у дисков разделы
- name: Check if non-system disks have partitions
  shell: "lsblk {{ item }} -no TYPE | grep -c part || echo '0'"
  register: disk_partition_counts
  with_items: "{{ nonsystem_disks | default([]) }}"
  changed_when: false
  ignore_errors: yes
  when: nonsystem_disks is defined and nonsystem_disks | length > 0

# Проверяем, используются ли диски
- name: Check if non-system disks are in use
  shell: "lsblk {{ item }} -no MOUNTPOINT | grep -v '^$' | wc -l || echo '0'"
  register: disk_usage_counts
  with_items: "{{ nonsystem_disks | default([]) }}"
  changed_when: false
  ignore_errors: yes
  when: nonsystem_disks is defined and nonsystem_disks | length > 0

# Формируем список дисков для монтирования
- name: Prepare storage devices
  set_fact:
    storage_devices: []

- name: Add safe raw disks to storage devices
  set_fact:
    storage_devices: "{{ storage_devices + [item.0] }}"
  with_together:
    - "{{ nonsystem_disks | default([]) }}"
    - "{{ disk_partition_counts.results | default([]) }}"
    - "{{ disk_usage_counts.results | default([]) }}"
  when:
    - nonsystem_disks is defined and nonsystem_disks | length > 0
    - disk_partition_counts.results is defined
    - disk_usage_counts.results is defined
    - item.1.stdout | int == 0  # Нет разделов
    - item.2.stdout | int == 0  # Не используется
  ignore_errors: yes

- name: Display storage devices for mounting
  debug:
    msg: "Storage devices for mounting: {{ storage_devices | default([]) }}"

# Проверяем, если список пуст, выводим предупреждение
- name: Display warning if no storage devices found
  debug:
    msg: "WARNING: No suitable non-system storage devices found for mounting!"
  when: storage_devices is not defined or storage_devices | length == 0

# Проверяем файловые системы на устройствах
- name: Check filesystem on devices
  shell: "blkid -s TYPE -o value {{ item }} 2>/dev/null || echo 'none'"
  register: fs_types
  with_items: "{{ storage_devices | default([]) }}"
  changed_when: false
  ignore_errors: yes
  when: storage_devices is defined and storage_devices | length > 0

- name: Display filesystem types
  debug:
    msg: "Filesystem on {{ item.0 }}: {{ item.1.stdout }}"
  with_together:
    - "{{ storage_devices | default([]) }}"
    - "{{ fs_types.results | default([]) }}"
  when: 
    - storage_devices is defined and storage_devices | length > 0
    - fs_types.results is defined

# Только форматируем диски, у которых нет файловой системы
- name: Format disks without filesystem
  filesystem:
    dev: "{{ item.0 }}"
    fstype: ext4
    force: no
  with_together:
    - "{{ storage_devices | default([]) }}"
    - "{{ fs_types.results | default([]) }}"
  when:
    - storage_devices is defined and storage_devices | length > 0
    - fs_types.results is defined
    - item.1.stdout == 'none'
  register: format_results
  ignore_errors: yes

# Создаем каталоги для монтирования
- name: Create mount points
  file:
    path: "{{ nfs_mount_base }}/{{ item | basename }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  with_items: "{{ storage_devices | default([]) }}"
  when: storage_devices is defined and storage_devices | length > 0

# Проверяем файловые системы снова после форматирования
- name: Recheck filesystem after formatting
  shell: "blkid -s TYPE -o value {{ item }} 2>/dev/null || echo 'none'"
  register: fs_types_after
  with_items: "{{ storage_devices | default([]) }}"
  changed_when: false
  ignore_errors: yes
  when: storage_devices is defined and storage_devices | length > 0

# Монтируем устройства
- name: Mount storage devices
  mount:
    path: "{{ nfs_mount_base }}/{{ item.0 | basename }}"
    src: "{{ item.0 }}"
    fstype: "{{ item.1.stdout if item.1.stdout != 'none' else 'ext4' }}"
    opts: "defaults,noatime,nofail"
    state: mounted
  with_together:
    - "{{ storage_devices | default([]) }}"
    - "{{ fs_types_after.results | default([]) }}"
  when:
    - storage_devices is defined and storage_devices | length > 0
    - fs_types_after.results is defined
    - item.1.stdout != 'none'
  register: mount_results
  ignore_errors: yes

# Проверяем результаты монтирования
- name: Verify mounts
  shell: "df -h | grep -E '{{ nfs_mount_base }}' || echo 'No mounted devices found'"
  register: mount_verification
  changed_when: false
  ignore_errors: yes

- name: Display mounted devices
  debug:
    msg: "{{ mount_verification.stdout_lines | default(['No mounted devices found']) }}"

# Создаем storage_disks для экспорта NFS
- name: Initialize storage_disks variable
  set_fact:
    storage_disks: []

- name: Update storage_disks with mounted devices
  set_fact:
    storage_disks: "{{ storage_disks + [{'device': item.0, 'mountpoint': item.0 | basename, 'fstype': item.1.stdout if item.1.stdout != 'none' else 'ext4'}] }}"
  with_together:
    - "{{ storage_devices | default([]) }}"
    - "{{ fs_types_after.results | default([]) }}"
  when:
    - storage_devices is defined and storage_devices | length > 0
    - fs_types_after.results is defined
    - item.1.stdout != 'none'

- name: Display storage_disks for NFS export
  debug:
    msg: "Storage disks for NFS export: {{ storage_disks | default([]) }}"