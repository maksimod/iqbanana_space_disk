---
# Улучшенный скрипт для надежного определения и монтирования несистемных разделов

# Установка необходимых пакетов
- name: Install necessary packages for disk management
  package:
    name:
      - parted
      - gdisk
      - xfsprogs
      - util-linux
      - uuid-runtime
      - e2fsprogs
    state: present
  ignore_errors: yes

# Получаем информацию о системе
- name: Gather facts
  setup:
  when: ansible_os_family is not defined

# Определяем корневой раздел
- name: Identify root partition
  shell: "findmnt -n -o SOURCE /"
  register: root_partition
  changed_when: false
  ignore_errors: yes

- name: Display root partition
  debug:
    msg: "Root partition is {{ root_partition.stdout }}"

# Получаем системный диск
- name: Identify system disk
  shell: "lsblk -no pkname {{ root_partition.stdout }} 2>/dev/null || echo ''"
  register: system_disk_name
  changed_when: false
  ignore_errors: yes

- name: Set system disk variable
  set_fact:
    system_disk: "/dev/{{ system_disk_name.stdout }}"
  when: system_disk_name.stdout != '' and system_disk_name.stdout != 'NAME'

# Получаем все блочные устройства
- name: Find all block devices
  shell: "lsblk -dpno NAME | grep -E '^/dev/[a-z]d[a-z]$'"
  register: all_disks
  changed_when: false
  ignore_errors: yes

- name: Display all disks
  debug:
    msg: "All disks: {{ all_disks.stdout_lines | default([]) }}"

# Фильтруем системный диск
- name: Filter out system disk
  set_fact:
    storage_devices: "{{ all_disks.stdout_lines | reject('search', system_disk_name.stdout) | list }}"
  when: 
    - all_disks.stdout_lines is defined 
    - all_disks.stdout_lines | length > 0
    - system_disk_name.stdout != ''

# Если система не распознала системный диск, используем другой метод
- name: Get mounted partitions
  shell: "cat /proc/mounts | grep -E '^/dev/[a-z]' | cut -d' ' -f1"
  register: mounted_partitions
  changed_when: false
  ignore_errors: yes
  when: storage_devices is not defined or storage_devices | length == 0

# Извлекаем диски из разделов
- name: Extract disks from partitions
  shell: "echo {{ mounted_partitions.stdout_lines | join(' ') }} | xargs -n1 lsblk -no pkname 2>/dev/null | sort | uniq | sed 's/^/\\/dev\\//'"
  register: system_disks_from_mounts
  changed_when: false
  ignore_errors: yes
  when: 
    - mounted_partitions is defined
    - mounted_partitions.stdout_lines is defined
    - mounted_partitions.stdout_lines | length > 0

# Фильтруем системные диски из всех дисков
- name: Filter system disks from all disks
  set_fact:
    storage_devices: "{{ all_disks.stdout_lines | difference(system_disks_from_mounts.stdout_lines) }}"
  when: 
    - system_disks_from_mounts is defined
    - system_disks_from_mounts.stdout_lines is defined
    - all_disks.stdout_lines is defined
    - (storage_devices is not defined or storage_devices | length == 0)

# Показываем найденные устройства
- name: Display storage devices
  debug:
    msg: "Storage devices for mounting: {{ storage_devices | default([]) }}"

# Проверяем, если нет устройств, выдаем предупреждение
- name: Warning if no storage devices
  debug:
    msg: "WARNING: No storage devices found!"
  when: storage_devices is not defined or storage_devices | length == 0

# Размонтирование всех найденных несистемных дисков перед форматированием
- name: Unmount any mounted storage devices
  shell: "umount {{ item }} 2>/dev/null || true"
  with_items: "{{ storage_devices | default([]) }}"
  ignore_errors: yes
  when: storage_devices is defined and storage_devices | length > 0

# Очистка таблицы разделов на устройствах для полного форматирования
- name: Wipe partition tables on storage devices
  shell: "wipefs -a {{ item }} && sgdisk -Z {{ item }} 2>/dev/null || true"
  with_items: "{{ storage_devices | default([]) }}"
  ignore_errors: yes
  when: storage_devices is defined and storage_devices | length > 0

# Создание новой таблицы разделов GPT
- name: Create new GPT partition tables
  shell: "parted -s {{ item }} mklabel gpt && parted -s {{ item }} mkpart primary 0% 100% && sleep 2"
  with_items: "{{ storage_devices | default([]) }}"
  ignore_errors: yes
  when: storage_devices is defined and storage_devices | length > 0

# Получение информации о созданных разделах
- name: Get new partition info
  shell: "lsblk -no NAME,MOUNTPOINT {{ item }} | grep -v ' /' | grep -v ' [SWAP]' | grep -v ' /boot' | grep -v $(basename {{ item }})$ | awk '{print $1}' | sed 's/[^a-zA-Z0-9]//g' | head -1"
  register: new_partitions
  with_items: "{{ storage_devices | default([]) }}"
  changed_when: false
  ignore_errors: yes
  when: storage_devices is defined and storage_devices | length > 0

# Форматирование новых разделов в XFS (оптимально для больших файлов)
- name: Format new partitions with XFS
  shell: "mkfs.xfs -f /dev/$(echo {{ item.stdout }}) 2>/dev/null || true"
  with_items: "{{ new_partitions.results | default([]) }}"
  when: 
    - storage_devices is defined 
    - storage_devices | length > 0
    - item.stdout is defined
    - item.stdout != ""
  ignore_errors: yes

# Получение UUID разделов
- name: Get UUID for new partitions
  shell: "blkid -s UUID -o value /dev/{{ item.stdout }}"
  register: partition_uuids
  with_items: "{{ new_partitions.results | default([]) }}"
  when:
    - storage_devices is defined
    - storage_devices | length > 0
    - item.stdout is defined
    - item.stdout != ""
  ignore_errors: yes

# Создаем каталоги для монтирования
- name: Create mount points
  file:
    path: "{{ nfs_mount_base }}/{{ item | basename }}"
    state: directory
    mode: '0777'
    owner: nobody
    group: nogroup
  with_items: "{{ storage_devices | default([]) }}"
  when: storage_devices is defined and storage_devices | length > 0

# Монтируем новые разделы по UUID
- name: Mount new partitions using UUID
  shell: "mkdir -p {{ nfs_mount_base }}/{{ item.1 | basename }} && mount UUID=$(blkid -s UUID -o value /dev/{{ item.0.stdout }}) {{ nfs_mount_base }}/{{ item.1 | basename }} && echo 'Mounted successfully by UUID'"
  with_together:
    - "{{ new_partitions.results | default([]) }}"
    - "{{ storage_devices | default([]) }}"
  when: 
    - storage_devices is defined 
    - storage_devices | length > 0
    - item.0.stdout is defined
    - item.0.stdout != ""
  register: mount_result
  ignore_errors: yes

# Безопасно удаляем все записи монтирования, относящиеся к нашим хранилищам
- name: Remove all storage mount entries from fstab
  lineinfile:
    path: /etc/fstab
    regexp: '^\S+\s+{{ nfs_mount_base }}/\S+'
    state: absent
  ignore_errors: yes

# Добавляем монтирование по UUID в fstab
- name: Add mounts to fstab using UUID for persistent mounting
  lineinfile:
    path: /etc/fstab
    regexp: ".*{{ nfs_mount_base }}/{{ item.1 | basename }}.*"
    line: "UUID={{ partition_uuids.results[loop_index].stdout }} {{ nfs_mount_base }}/{{ item.1 | basename }} xfs defaults,noatime,logbufs=8,logbsize=256k,nofail 0 0"
    state: present
  with_together:
    - "{{ new_partitions.results | default([]) }}"
    - "{{ storage_devices | default([]) }}"
  loop_control:
    index_var: loop_index
  when: 
    - storage_devices is defined 
    - storage_devices | length > 0
    - item.0.stdout is defined
    - item.0.stdout != ""
    - partition_uuids is defined
    - partition_uuids.results is defined
    - partition_uuids.results[loop_index].stdout is defined
  ignore_errors: yes
  
# Добавим проверку результата монтирования
- name: Display mount results
  debug:
    msg: "Монтирование {{ item.item.1 | basename }}: {{ 'Успешно' if item.rc == 0 else 'Не удалось: ' + item.stderr }}"
  with_items: "{{ mount_result.results | default([]) }}"
  when: mount_result is defined and mount_result.results is defined

# Добавим проверку результата монтирования
- name: Verify mount results
  debug:
    msg: "Mounted {{ item.item.1 | basename }} as {{ item.item.0.stdout }}: {{ item.changed }}"
  with_items: "{{ mount_result.results | default([]) }}"
  when: mount_result is defined

# Создаем storage_disks для экспорта NFS с UUID
- name: Initialize storage_disks variable
  set_fact:
    storage_disks: []

# Обновляем storage_disks с информацией о новых разделах и их UUID
- name: Update storage_disks with new partitions and UUID
  set_fact:
    storage_disks: "{{ storage_disks + [{'device': item.1, 'partition': '/dev/' + item.0.stdout, 'mountpoint': item.1 | basename, 'fstype': 'xfs', 'uuid': partition_uuids.results[loop_index].stdout }] }}"
  with_together:
    - "{{ new_partitions.results | default([]) }}"
    - "{{ storage_devices | default([]) }}"
  loop_control:
    index_var: loop_index
  when: 
    - storage_devices is defined 
    - storage_devices | length > 0
    - item.0.stdout is defined
    - item.0.stdout != ""
    - partition_uuids is defined
    - partition_uuids.results is defined
    - partition_uuids.results[loop_index].stdout is defined

# Показываем итоговую информацию о смонтированных дисках
- name: Display mounted disks information
  shell: "df -h | grep {{ nfs_mount_base }}"
  register: mounted_disks_info
  ignore_errors: yes
  changed_when: false

- name: Show mounted disks
  debug:
    msg: "{{ mounted_disks_info.stdout_lines | default(['No disks mounted']) }}"

# Показываем UUID всех дисков для отладки
- name: Display UUID information of all mounted disks
  debug:
    msg: "{{ storage_disks }}"
  when: storage_disks is defined and storage_disks | length > 0