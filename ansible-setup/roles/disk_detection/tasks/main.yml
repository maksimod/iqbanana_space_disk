---
# Усовершенствованный скрипт для надежного определения и монтирования несистемных разделов
# Решает проблемы с непримонтированными системными разделами, нестандартными разделами и LVM

- name: Ensure system is fully booted before proceeding
  shell: systemctl is-system-running | grep -E 'running|degraded' || echo "not_ready"
  register: system_state
  changed_when: false
  ignore_errors: yes

- name: Wait for system to be fully initialized
  debug:
    msg: "System state: {{ system_state.stdout }}"
  failed_when: system_state.stdout == "not_ready"
  when: system_state.stdout is defined

# Проверка доступности критически важных утилит
- name: Check for essential system tools
  shell: which lsblk findmnt blkid
  register: system_tools
  changed_when: false
  ignore_errors: yes

- name: Verify essential tools are available
  debug:
    msg: "Essential tools check: {{ system_tools.rc }}"
  failed_when: system_tools.rc != 0
  
- name: Get disk information with more details
  shell: lsblk -o NAME,TYPE,MOUNTPOINT,UUID,FSTYPE,LABEL,SIZE,PKNAME -J
  register: disk_info_json
  changed_when: false

- name: Parse disk information to JSON
  set_fact:
    disk_data: "{{ disk_info_json.stdout | from_json }}"

# Получение информации о LVM конфигурации
- name: Check if LVM is installed
  command: which lvs
  register: lvs_check
  changed_when: false
  ignore_errors: yes

- name: Get LVM volume groups information if LVM exists
  shell: vgs --noheadings -o vg_name | tr -d " "
  register: vg_names
  changed_when: false
  when: lvs_check.rc == 0

- name: Get detailed LVM physical volumes info for proper VG tracking
  shell: pvs --noheadings -o pv_name,vg_name | awk '{print $1","$2}'
  register: pv_to_vg_mapping
  changed_when: false
  when: lvs_check.rc == 0

- name: Get logical volumes information if LVM exists
  shell: lvs --noheadings -o vg_name,lv_name | awk '{print $1"/"$2}'
  register: lv_info
  changed_when: false
  when: lvs_check.rc == 0

# Поиск и анализ bind-монтирований
- name: Identify bind mounts from mount output
  shell: mount | grep -i "bind" | awk '{print $1" "$3}'
  register: bind_mounts
  changed_when: false
  ignore_errors: yes

# Определение корневого диска, включая LVM
- name: Identify root device
  shell: findmnt -n -o SOURCE / | sed 's/\[.*\]//'
  register: root_device_raw
  changed_when: false

- name: Set root device facts
  set_fact:
    root_device_path: "{{ root_device_raw.stdout }}"
    is_root_lvm: "{{ root_device_raw.stdout is regex('^/dev/mapper/') }}"

- name: Get root volume group if using LVM
  shell: lvs "{{ root_device_path }}" --noheadings -o vg_name | tr -d " "
  register: root_vg
  changed_when: false
  when: is_root_lvm

- name: Set root VG name if using LVM
  set_fact:
    root_vg_name: "{{ root_vg.stdout }}"
  when: is_root_lvm and root_vg.stdout != ""

# Получение всех системных точек монтирования из fstab
- name: Get list of ALL mount points from /etc/fstab (even if not currently mounted)
  shell: grep -v "^#" /etc/fstab | awk '{if ($2 != "none" && $2 != "swap") print $2}'
  register: fstab_mount_points
  changed_when: false

# Получение устройств из fstab
- name: Get all devices from /etc/fstab
  shell: grep -v "^#" /etc/fstab | awk '{if ($1 != "UUID=" && $1 != "LABEL=" && $1 != "/dev/disk/by-uuid/" && $1 != "/dev/disk/by-label/") print $1}'
  register: fstab_devices
  changed_when: false

# Получаем UUID устройств из fstab
- name: Get UUIDs from /etc/fstab
  shell: grep -v "^#" /etc/fstab | grep -E 'UUID=|/dev/disk/by-uuid/' | awk '{print $1}' | sed -E 's/UUID=|\/dev\/disk\/by-uuid\///'
  register: fstab_uuids
  changed_when: false

# Находим bind-монтирования в fstab
- name: Identify bind mounts in fstab
  shell: grep -v "^#" /etc/fstab | grep -E 'bind|rbind' | awk '{print $1" "$2}'
  register: fstab_bind_mounts
  changed_when: false
  ignore_errors: yes

# Создание расширенного списка системных путей
- name: Create list of system mount paths
  set_fact:
    system_mount_paths: |
      {{ fstab_mount_points.stdout_lines +
         [
           '/',
           '/boot',
           '/boot/efi',
           '/home',
           '/var',
           '/var/log',
           '/var/lib',
           '/usr',
           '/usr/local',
           '/tmp',
           '/opt',
           '/srv',
           None,
           '[SWAP]',
           'swap'
         ] + (additional_system_paths | default([])) }}

# Получение текущих точек монтирования
- name: Get currently mounted filesystems
  shell: findmnt -l -o TARGET -n
  register: current_mounts
  changed_when: false

- name: Update list of system mount paths with currently mounted paths
  set_fact:
    system_mount_paths: "{{ system_mount_paths + current_mounts.stdout_lines }}"

# Создаем список bind-монтирований для исключения
- name: Create list of bind mounted sources
  set_fact:
    bind_mount_sources: |
      {% set sources = [] %}
      {% if bind_mounts.stdout_lines is defined %}
        {% for line in bind_mounts.stdout_lines %}
          {% set parts = line.split() %}
          {% if parts|length >= 2 %}
            {% set sources = sources + [parts[0]] %}
          {% endif %}
        {% endfor %}
      {% endif %}
      {% if fstab_bind_mounts.stdout_lines is defined %}
        {% for line in fstab_bind_mounts.stdout_lines %}
          {% set parts = line.split() %}
          {% if parts|length >= 2 %}
            {% set sources = sources + [parts[0]] %}
          {% endif %}
        {% endfor %}
      {% endif %}
      {{ sources | unique | list }}

# Определение системных дисков и разделов на основе устройства корневого раздела
- name: Get physical device for root if using standard partitioning
  shell: lsblk -no PKNAME "{{ root_device_path }}" | head -1
  register: root_disk_name
  changed_when: false
  when: not is_root_lvm
  ignore_errors: yes

# Дополнительная проверка системного диска через поиск раздела, смонтированного в /
- name: Verify system disk via direct mountpoint check
  shell: lsblk -no NAME,MOUNTPOINT | grep " /$" | awk '{print $1}' | sed 's/[0-9]*$//'
  register: system_disk_verification
  changed_when: false
  ignore_errors: yes

- name: Get all physical devices for all volume groups if using LVM
  set_fact:
    vg_to_pv_mapping: |
      {% set mapping = {} %}
      {% if pv_to_vg_mapping.stdout_lines is defined %}
        {% for line in pv_to_vg_mapping.stdout_lines %}
          {% set parts = line.split(',') %}
          {% if parts|length == 2 and parts[1] != '' %}
            {% if parts[1] not in mapping %}
              {% set _ = mapping.update({parts[1]: []}) %}
            {% endif %}
            {% set _ = mapping[parts[1]].append(parts[0]) %}
          {% endif %}
        {% endfor %}
      {% endif %}
      {{ mapping }}
  when: lvs_check.rc == 0

- name: Identify all system devices to exclude
  set_fact:
    system_devices: |
      {% set devices = [] %}
      {% if not is_root_lvm and root_disk_name.stdout != "" %}
        {% set devices = devices + ['/dev/' + root_disk_name.stdout] %}
      {% endif %}
      {% if system_disk_verification.stdout != "" %}
        {% set devices = devices + ['/dev/' + system_disk_verification.stdout] %}
      {% endif %}
      {% if is_root_lvm and root_vg_name is defined and vg_to_pv_mapping is defined %}
        {% set pvs_for_root_vg = vg_to_pv_mapping.get(root_vg_name, []) %}
        {% set devices = devices + pvs_for_root_vg %}
      {% endif %}
      {% if fstab_devices.stdout_lines is defined %}
        {% set devices = devices + fstab_devices.stdout_lines %}
      {% endif %}
      {% if bind_mount_sources is defined %}
        {% set devices = devices + bind_mount_sources %}
      {% endif %}
      {{ devices | unique | list }}

- name: Debug system devices
  debug:
    msg: "System devices to exclude: {{ system_devices }}"

# Идентификация несистемных разделов с учетом полученной информации
- name: Identify non-system partitions
  set_fact:
    non_system_partitions: []

- name: Process each block device to identify non-system partitions
  set_fact:
    non_system_partitions: >-
      {% set ns_partitions = non_system_partitions %}
      {% for device in disk_data.blockdevices %}
        {% if device.type == 'disk' and device.children is defined %}
          {% for part in device.children %}
            {% if part.type == 'part' and 
                  part.mountpoint not in system_mount_paths and
                  '/dev/' + part.name not in system_devices and
                  '/dev/' + device.name not in system_devices and
                  part.fstype is defined and part.fstype != 'swap' and part.fstype != '' and
                  part.mountpoint != '[SWAP]' %}
              {% set ns_partitions = ns_partitions + ['/dev/' + part.name] %}
            {% endif %}
          {% endfor %}
        {% endif %}
      {% endfor %}
      {{ ns_partitions }}

# Исключение всех LVM-разделов из VG, связанных с системными разделами
- name: Remove LVM logical volumes from system volume groups
  set_fact:
    non_system_partitions: >-
      {% set filtered_partitions = [] %}
      {% for part in non_system_partitions %}
        {% set is_system_lv = false %}
        {% if is_root_lvm and part is regex('^/dev/mapper/') %}
          {% for vg_name in vg_names.stdout_lines %}
            {% if part is regex('^/dev/mapper/' + vg_name + '.*') %}
              {% if vg_name == root_vg_name or vg_to_pv_mapping.get(vg_name, []) | intersect(system_devices) | length > 0 %}
                {% set is_system_lv = true %}
              {% endif %}
            {% endif %}
          {% endfor %}
        {% endif %}
        {% if not is_system_lv %}
          {% set filtered_partitions = filtered_partitions + [part] %}
        {% endif %}
      {% endfor %}
      {{ filtered_partitions }}
  when: is_root_lvm and vg_names.stdout_lines | length > 0

# Исключение разделов с UUID, указанными в fstab
- name: Remove partitions with UUIDs listed in fstab
  shell: blkid "{{ item }}" | grep -o 'UUID="[^"]*"' | cut -d'"' -f2
  register: partition_uuids
  changed_when: false
  with_items: "{{ non_system_partitions }}"
  ignore_errors: yes

- name: Filter out partitions based on UUID
  set_fact:
    non_system_partitions: >-
      {% set filtered_partitions = [] %}
      {% for i in range(non_system_partitions | length) %}
        {% if partition_uuids.results[i].stdout not in fstab_uuids.stdout_lines %}
          {% set filtered_partitions = filtered_partitions + [non_system_partitions[i]] %}
        {% endif %}
      {% endfor %}
      {{ filtered_partitions }}
  when: partition_uuids.results | length > 0 and fstab_uuids.stdout_lines | length > 0

# Исключение уже используемых в bind-монтировании дисков
- name: Filter out partitions used in bind mounts
  set_fact:
    non_system_partitions: >-
      {% set filtered_partitions = [] %}
      {% for part in non_system_partitions %}
        {% if part not in bind_mount_sources %}
          {% set filtered_partitions = filtered_partitions + [part] %}
        {% endif %}
      {% endfor %}
      {{ filtered_partitions }}

- name: Display identified non-system partitions
  debug:
    msg: "Identified non-system partitions: {{ non_system_partitions }}"

- name: Display warning if no non-system partitions found
  debug:
    msg: "WARNING: No non-system partitions were identified. Nothing will be mounted."
  when: non_system_partitions | length == 0

- name: Perform additional safety checks
  block:
    - name: Check partitions are not already mounted
      shell: findmnt -n -o SOURCE "{{ item }}" || echo "not_mounted"
      register: mount_check_results
      changed_when: false
      loop: "{{ non_system_partitions }}"
      
    - name: Verify no root partitions are in the detected list
      shell: "findmnt -n -o SOURCE / | grep -q {{ item }} || echo 'safe'"
      register: root_safety_check
      with_items: "{{ non_system_partitions }}"
      changed_when: false
      ignore_errors: yes
      
    - name: Remove any partitions that may be system partitions
      set_fact:
        verified_non_system: "{{ non_system_partitions | zip(root_safety_check.results) | selectattr('1.stdout', 'equalto', 'safe') | map(attribute='0') | list }}"
      
    - name: Filter out already mounted partitions
      set_fact:
        safe_partitions: "{{ verified_non_system | zip(mount_check_results.results) | selectattr('1.stdout', 'equalto', 'not_mounted') | map(attribute='0') | list }}"

    - name: Display partitions that will be mounted
      debug:
        msg: "Partitions that will be safely mounted: {{ safe_partitions }}"

    - name: Get filesystem types for partitions
      shell: blkid -s TYPE -o value "{{ item }}"
      register: fs_types
      changed_when: false
      with_items: "{{ safe_partitions }}"
      ignore_errors: yes

    - name: Get UUIDs for partitions
      shell: blkid -s UUID -o value "{{ item }}"
      register: uuid_values
      changed_when: false
      with_items: "{{ safe_partitions }}"
      ignore_errors: yes

    - name: Create mount points for non-system partitions
      file:
        path: "{{ nfs_mount_base }}/{{ item | basename }}"
        state: directory
        mode: '0755'
      with_items: "{{ safe_partitions }}"
      when: safe_partitions | length > 0

    - name: Mount non-system partitions
      mount:
        path: "{{ nfs_mount_base }}/{{ item.0 | basename }}"
        src: "{{ item.0 }}"
        fstype: "{{ item.1.stdout if item.1.stdout else 'auto' }}"
        state: mounted
        opts: "defaults,noatime"
      with_together:
        - "{{ safe_partitions }}"
        - "{{ fs_types.results }}"
      when: safe_partitions | length > 0
      register: mount_result

    - name: Add entries to fstab with appropriate options
      mount:
        path: "{{ nfs_mount_base }}/{{ item.0 | basename }}"
        src: "UUID={{ item.2.stdout }}"
        fstype: "{{ item.1.stdout if item.1.stdout else 'auto' }}"
        state: present
        opts: >-
          {% if item.1.stdout in ['nfs', 'nfs4', 'cifs', 'smbfs', 'glusterfs', 'fuse.glusterfs'] %}
          defaults,noatime,_netdev
          {% else %}
          defaults,noatime,nofail
          {% endif %}
      with_together:
        - "{{ safe_partitions }}"
        - "{{ fs_types.results }}"
        - "{{ uuid_values.results }}"
      when: safe_partitions | length > 0 and item.2.stdout != ""
      register: fstab_result
      
    - name: Report mounting results
      debug:
        msg: "Successfully mounted {{ mount_result.results | selectattr('changed', 'equalto', true) | map(attribute='item.0') | list }}"
      when: safe_partitions | length > 0 and mount_result.changed

    - name: Report fstab entries added
      debug:
        msg: "Successfully added to fstab: {{ fstab_result.results | selectattr('changed', 'equalto', true) | map(attribute='item.0') | list }}"
      when: safe_partitions | length > 0 and fstab_result.changed