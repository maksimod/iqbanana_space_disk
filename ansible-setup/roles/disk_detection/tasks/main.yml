---
# Улучшенный скрипт для надежного определения и монтирования несистемных разделов

# Получаем информацию о системе
- name: Gather facts
  setup:
  when: ansible_os_family is not defined

# Определяем корневой раздел
- name: Identify root partition
  shell: "findmnt -n -o SOURCE /"
  register: root_partition
  changed_when: false
  ignore_errors: yes

- name: Display root partition
  debug:
    msg: "Root partition is {{ root_partition.stdout }}"

# Получаем системный диск
- name: Identify system disk
  shell: "lsblk -no pkname {{ root_partition.stdout }} 2>/dev/null || echo ''"
  register: system_disk_name
  changed_when: false
  ignore_errors: yes

- name: Set system disk variable
  set_fact:
    system_disk: "/dev/{{ system_disk_name.stdout }}"
  when: system_disk_name.stdout != '' and system_disk_name.stdout != 'NAME'

# Получаем все блочные устройства
- name: Find all block devices
  shell: "lsblk -dpno NAME | grep -E '^/dev/[a-z]d[a-z]$'"
  register: all_disks
  changed_when: false
  ignore_errors: yes

- name: Display all disks
  debug:
    msg: "All disks: {{ all_disks.stdout_lines | default([]) }}"

# Фильтруем системный диск
- name: Filter out system disk
  set_fact:
    storage_devices: "{{ all_disks.stdout_lines | reject('search', system_disk_name.stdout) | list }}"
  when: 
    - all_disks.stdout_lines is defined 
    - all_disks.stdout_lines | length > 0
    - system_disk_name.stdout != ''

# Если система не распознала системный диск, используем другой метод
- name: Get mounted partitions
  shell: "cat /proc/mounts | grep -E '^/dev/[a-z]' | cut -d' ' -f1"
  register: mounted_partitions
  changed_when: false
  ignore_errors: yes
  when: storage_devices is not defined or storage_devices | length == 0

# Извлекаем диски из разделов
- name: Extract disks from partitions
  shell: "echo {{ mounted_partitions.stdout_lines | join(' ') }} | xargs -n1 lsblk -no pkname 2>/dev/null | sort | uniq | sed 's/^/\\/dev\\//'"
  register: system_disks_from_mounts
  changed_when: false
  ignore_errors: yes
  when: 
    - mounted_partitions is defined
    - mounted_partitions.stdout_lines is defined
    - mounted_partitions.stdout_lines | length > 0

# Фильтруем системные диски из всех дисков
- name: Filter system disks from all disks
  set_fact:
    storage_devices: "{{ all_disks.stdout_lines | difference(system_disks_from_mounts.stdout_lines) }}"
  when: 
    - system_disks_from_mounts is defined
    - system_disks_from_mounts.stdout_lines is defined
    - all_disks.stdout_lines is defined
    - (storage_devices is not defined or storage_devices | length == 0)

# Показываем найденные устройства
- name: Display storage devices
  debug:
    msg: "Storage devices for mounting: {{ storage_devices | default([]) }}"

# Проверяем, если нет устройств, выдаем предупреждение
- name: Warning if no storage devices
  debug:
    msg: "WARNING: No storage devices found!"
  when: storage_devices is not defined or storage_devices | length == 0

# Проверяем файловые системы на устройствах
- name: Check filesystem on devices
  shell: "blkid -s TYPE -o value {{ item }} 2>/dev/null || echo 'none'"
  register: fs_types
  with_items: "{{ storage_devices | default([]) }}"
  changed_when: false
  ignore_errors: yes
  when: storage_devices is defined and storage_devices | length > 0

# Форматируем только диски без файловой системы
- name: Format disks without filesystem
  filesystem:
    dev: "{{ item.0 }}"
    fstype: ext4
    force: no
  with_together:
    - "{{ storage_devices | default([]) }}"
    - "{{ fs_types.results | default([]) }}"
  when:
    - storage_devices is defined and storage_devices | length > 0
    - fs_types.results is defined
    - item.1.stdout == 'none'
  ignore_errors: yes

# Создаем каталоги для монтирования
- name: Create mount points
  file:
    path: "{{ nfs_mount_base }}/{{ item | basename }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  with_items: "{{ storage_devices | default([]) }}"
  when: storage_devices is defined and storage_devices | length > 0

# Монтируем устройства
- name: Mount storage devices
  mount:
    path: "{{ nfs_mount_base }}/{{ item.0 | basename }}"
    src: "{{ item.0 }}"
    fstype: "{{ item.1.stdout if item.1.stdout != 'none' else 'ext4' }}"
    opts: "defaults,noatime,nofail"
    state: mounted
  with_together:
    - "{{ storage_devices | default([]) }}"
    - "{{ fs_types.results | default([]) }}"
  when:
    - storage_devices is defined and storage_devices | length > 0
    - fs_types.results is defined
  register: mount_results
  ignore_errors: yes

# Создаем storage_disks для экспорта NFS
- name: Initialize storage_disks variable
  set_fact:
    storage_disks: []

- name: Update storage_disks with mounted devices
  set_fact:
    storage_disks: "{{ storage_disks + [{'device': item.0, 'mountpoint': item.0 | basename, 'fstype': item.1.stdout if item.1.stdout != 'none' else 'ext4'}] }}"
  with_together:
    - "{{ storage_devices | default([]) }}"
    - "{{ fs_types.results | default([]) }}"
  when:
    - storage_devices is defined and storage_devices | length > 0
    - fs_types.results is defined