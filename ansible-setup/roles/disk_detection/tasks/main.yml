---
# Улучшенный скрипт для надежного определения и монтирования несистемных разделов

# Установка необходимых пакетов
- name: Install necessary packages for disk management
  package:
    name:
      - parted
      - gdisk
      - xfsprogs
      - util-linux
      - uuid-runtime
      - e2fsprogs
    state: present
  ignore_errors: yes

# Получаем информацию о системе
- name: Gather facts
  setup:
  when: ansible_os_family is not defined

# Определяем корневой раздел
- name: Identify root partition
  shell: "findmnt -n -o SOURCE /"
  register: root_partition
  changed_when: false
  ignore_errors: yes

# Получаем системный диск
- name: Identify system disk
  shell: "lsblk -no pkname {{ root_partition.stdout }} 2>/dev/null || echo ''"
  register: system_disk_name
  changed_when: false
  ignore_errors: yes

- name: Set system disk variable
  set_fact:
    system_disk: "/dev/{{ system_disk_name.stdout }}"
  when: system_disk_name.stdout != '' and system_disk_name.stdout != 'NAME'

# Получаем все блочные устройства
- name: Find all block devices
  shell: "lsblk -dpno NAME | grep -E '^/dev/[a-z]d[a-z]$'"
  register: all_disks
  changed_when: false
  ignore_errors: yes

# Показываем найденные устройства
- name: Display all disks
  debug:
    msg: "All disks: {{ all_disks.stdout_lines | default([]) }}"

# Фильтруем системный диск
- name: Filter out system disk
  set_fact:
    storage_devices: "{{ all_disks.stdout_lines | reject('search', system_disk_name.stdout) | list }}"
  when: 
    - all_disks.stdout_lines is defined 
    - all_disks.stdout_lines | length > 0
    - system_disk_name.stdout != ''

# Показываем найденные устройства
- name: Display storage devices
  debug:
    msg: "Storage devices for mounting: {{ storage_devices | default([]) }}"

# Проверяем, если нет устройств, выдаем предупреждение
- name: Warning if no storage devices
  debug:
    msg: "WARNING: No storage devices found!"
  when: storage_devices is not defined or storage_devices | length == 0

# Проверка использования дисков перед размонтированием
- name: Check if disks are in use
  shell: "lsof {{ item }} 2>/dev/null || echo 'Not in use'"
  register: disk_usage
  with_items: "{{ storage_devices | default([]) }}"
  ignore_errors: yes
  when: storage_devices is defined and storage_devices | length > 0

# Принудительная остановка процессов, использующих диски
- name: Kill processes using disks if needed
  shell: "fuser -k {{ item.item }} 2>/dev/null || echo 'No processes to kill'"
  with_items: "{{ disk_usage.results | default([]) }}"
  when: item.stdout is defined and item.stdout != 'Not in use'
  ignore_errors: yes

# Размонтирование всех найденных несистемных дисков перед форматированием
- name: Unmount any mounted storage devices
  shell: "umount -f -l {{ item }} 2>/dev/null || true"
  with_items: "{{ storage_devices | default([]) }}"
  ignore_errors: yes
  when: storage_devices is defined and storage_devices | length > 0

# Ожидание завершения размонтирования
- name: Wait for unmount to complete
  wait_for:
    path: "{{ item }}"
    state: absent
    timeout: 10
  with_items: "{{ storage_devices | default([]) }}"
  ignore_errors: yes
  when: storage_devices is defined and storage_devices | length > 0

# Очистка таблицы разделов на устройствах для полного форматирования
- name: Wipe partition tables on storage devices
  shell: "wipefs -a {{ item }} && sgdisk -Z {{ item }} 2>/dev/null || true"
  with_items: "{{ storage_devices | default([]) }}"
  ignore_errors: yes
  when: storage_devices is defined and storage_devices | length > 0

# Создание новой таблицы разделов GPT с безопасной проверкой
# Вместо прямого форматирования диска, нужно добавить проверку наличия данных
- name: Check for existing data on storage devices
  shell: |
    DEVICE="{{ item }}"
    echo "Проверка диска $DEVICE на наличие существующих данных..."
    
    # Проверяем тип файловой системы
    FS_TYPE=$(blkid -o value -s TYPE $DEVICE 2>/dev/null)
    
    if [ -n "$FS_TYPE" ]; then
      # Файловая система уже существует
      echo "ВНИМАНИЕ: На диске $DEVICE обнаружена файловая система $FS_TYPE"
      echo "Пропускаем форматирование для сохранения данных"
      exit 100  # Специальный код для обозначения наличия данных
    else
      echo "Диск $DEVICE не содержит распознаваемой файловой системы"
      exit 0
    fi
  register: disk_data_check
  changed_when: false
  failed_when: disk_data_check.rc != 0 and disk_data_check.rc != 100
  with_items: "{{ storage_devices | default([]) }}"
  when: storage_devices is defined and storage_devices | length > 0

# Форматирование только пустых дисков
- name: Format empty disks with XFS filesystem
  shell: |
    # Сначала проверяем, используется ли диск
    if lsof {{ item.item }} 2>/dev/null | grep -q .; then
      echo "Обнаружены процессы, использующие {{ item.item }}, завершаем их..."
      fuser -k {{ item.item }} 2>/dev/null || true
      sleep 2
    fi
    
    # Проверяем, есть ли активные точки монтирования на диске
    MOUNT_POINTS=$(lsblk -no MOUNTPOINT {{ item.item }} 2>/dev/null | grep -v '^$')
    if [ -n "$MOUNT_POINTS" ]; then
      echo "Размонтирование точек монтирования: $MOUNT_POINTS"
      echo "$MOUNT_POINTS" | while read mp; do
        umount -f -l "$mp" 2>/dev/null || true
      done
      sleep 2
    fi
    
    # Форматируем диск напрямую в XFS (без создания разделов)
    echo "Форматирование диска {{ item.item }} в XFS..."
    mkfs.xfs -f {{ item.item }}
    
    # Проверяем успешность форматирования
    if file -s {{ item.item }} | grep -q "XFS"; then
      echo "✓ Диск {{ item.item }} успешно отформатирован в XFS"
      exit 0
    else
      echo "✗ Ошибка форматирования диска {{ item.item }}"
      exit 1
    fi
  with_items: "{{ disk_data_check.results | default([]) }}"
  register: format_result
  ignore_errors: yes
  when: 
    - storage_devices is defined 
    - storage_devices | length > 0
    - item.rc == 0  # Форматируем только диски без существующих файловых систем

# Создаем каталоги для монтирования
- name: Create mount points
  file:
    path: "{{ nfs_mount_base }}/{{ item | basename }}"
    state: directory
    mode: '0777'
    owner: nobody
    group: nogroup
  with_items: "{{ storage_devices | default([]) }}"
  when: storage_devices is defined and storage_devices | length > 0

# Получаем UUID дисков
- name: Get UUID for disks
  shell: "blkid -s UUID -o value {{ item }}"
  register: disk_uuids
  with_items: "{{ storage_devices | default([]) }}"
  when: storage_devices is defined and storage_devices | length > 0
  changed_when: false

# Монтирование дисков
- name: Mount disks directly
  mount:
    path: "{{ nfs_mount_base }}/{{ item | basename }}"
    src: "{{ item }}"
    fstype: xfs
    state: mounted
    opts: "defaults,nofail"
  with_items: "{{ storage_devices | default([]) }}"
  register: mount_result
  when: storage_devices is defined and storage_devices | length > 0

# Обновляем fstab с UUID
- name: Update fstab for disks with UUID
  lineinfile:
    path: /etc/fstab
    regexp: ".*{{ nfs_mount_base }}/{{ item.0 | basename }}.*"
    line: "UUID={{ item.1.stdout }} {{ nfs_mount_base }}/{{ item.0 | basename }} xfs defaults,nofail 0 0"
    state: present
  with_together:
    - "{{ storage_devices | default([]) }}"
    - "{{ disk_uuids.results | default([]) }}"
  when: 
    - storage_devices is defined 
    - storage_devices | length > 0
    - disk_uuids is defined
    - disk_uuids.results is defined

# Создаем storage_disks для экспорта NFS
- name: Initialize storage_disks variable
  set_fact:
    storage_disks: []

# Обновляем storage_disks с информацией о дисках и UUID
- name: Update storage_disks with UUID info
  set_fact:
    storage_disks: "{{ storage_disks + [{'device': item.0, 'mountpoint': item.0 | basename, 'fstype': 'xfs', 'uuid': item.1.stdout}] }}"
  with_together:
    - "{{ storage_devices | default([]) }}"
    - "{{ disk_uuids.results | default([]) }}"
  when: 
    - storage_devices is defined 
    - storage_devices | length > 0
    - disk_uuids is defined
    - disk_uuids.results is defined

# Показываем итоговую информацию о смонтированных дисках
- name: Display mounted disks information
  shell: "df -h | grep {{ nfs_mount_base }}"
  register: mounted_disks_info
  ignore_errors: yes
  changed_when: false

- name: Show mounted disks
  debug:
    msg: "{{ mounted_disks_info.stdout_lines | default(['No disks mounted']) }}"

# Показываем UUID всех дисков для отладки
- name: Display UUID information of all disks
  debug:
    msg: "{{ storage_disks }}"
  when: storage_disks is defined and storage_disks | length > 0