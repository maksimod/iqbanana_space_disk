---
- name: Check mount point exists
  stat:
    path: "{{ nfs_mount_point | default('/mnt/nfs_client') }}"
  register: mount_check

- name: Verify NFS mount
  shell: df -h | grep nfs
  register: mount_status
  ignore_errors: yes

- name: Create test file
  copy:
    content: "Test file created by Ansible verification"
    dest: "{{ nfs_mount_point | default('/mnt/nfs_client') }}/test.txt"
  register: test_file
  when: mount_check.stat.exists

- name: Read test file
  command: cat "{{ nfs_mount_point | default('/mnt/nfs_client') }}/test.txt"
  register: read_test
  when: test_file is success

- name: Remove test file
  file:
    path: "{{ nfs_mount_point | default('/mnt/nfs_client') }}/test.txt"
    state: absent
  when: read_test is success

- name: Generate verification report
  debug:
    msg:
      - "Mount point exists: {{ mount_check.stat.exists }}"
      - "Mount status: {{ mount_status.stdout_lines }}"
      - "Test file creation: {{ test_file }}"
      - "Test file read: {{ read_test }}" 