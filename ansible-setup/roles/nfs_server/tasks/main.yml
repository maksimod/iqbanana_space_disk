---
# Безопасная установка и настройка NFS сервера

# Установка NFS сервера
- name: Install NFS server packages
  package:
    name: 
      - nfs-kernel-server
      - ntfs-3g
      - ntfs-3g-dev
      - nfs-common
    state: present
  register: nfs_server_install

- name: Display NFS server installation status
  debug:
    msg: "{{ 'SUCCESS: NFS server installed' if nfs_server_install is succeeded else 'ERROR: Failed to install NFS server' }}"

# Создаем базовую директорию для хранения данных
- name: Create base storage directory
  file:
    path: "{{ nfs_mount_base }}"
    state: directory
    mode: '0777'
    owner: nobody
    group: nogroup

# Настройка NFS
- name: Configure NFS exports
  template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: '0644'
  register: nfs_exports_config

- name: Display NFS exports configuration status
  debug:
    msg: "{{ 'SUCCESS: NFS exports configured' if nfs_exports_config is succeeded else 'ERROR: Failed to configure NFS exports' }}"

# Перезапускаем NFS только если нужно
- name: Restart NFS server
  systemd:
    name: nfs-kernel-server
    state: restarted
  when: 
    - nfs_exports_config is changed or 
      nfs_server_install is changed

- name: Ensure NFS server is enabled to start at boot
  systemd:
    name: nfs-kernel-server
    enabled: yes

# Обновляем таблицу экспортов
- name: Update NFS exports
  shell: "exportfs -ra"
  when: nfs_exports_config is changed

- name: Verify NFS exports
  shell: "exportfs -v"
  register: exports_verification
  changed_when: false

- name: Display exports verification
  debug:
    msg: "Current NFS exports: {{ exports_verification.stdout_lines }}"
  when: exports_verification.stdout_lines is defined

# Создаем директории для экспорта
- name: Create export directories for disks
  file:
    path: "{{ nfs_mount_base }}/{{ item.mountpoint }}"
    state: directory
    owner: nobody
    group: nogroup
    mode: '0777'
  with_items: "{{ storage_disks }}"
  when: storage_disks is defined

# Проверяем, что NFS сервер правильно слушает порты
- name: Check NFS server ports
  shell: "rpcinfo -p | grep -E 'nfs|mountd'"
  register: nfs_ports
  changed_when: false
  failed_when: false

- name: Display NFS ports
  debug:
    msg: "NFS ports: {{ nfs_ports.stdout_lines }}"
  when: nfs_ports.stdout_lines is defined

- name: Unmount any existing mounts
  mount:
    path: "{{ nfs_mount_base }}/{{ item.mountpoint }}"
    state: unmounted
  with_items: "{{ storage_disks }}"
  ignore_errors: yes

- name: Wait for unmount operations
  pause:
    seconds: 2

- name: Create mount points for disks
  file:
    path: "{{ nfs_mount_base }}/{{ item.mountpoint }}"
    state: directory
    mode: '0777'
    owner: root
    group: root
  with_items: "{{ storage_disks }}"

- name: Wait for directory creation
  pause:
    seconds: 1

- name: Run ntfsfix on NTFS partitions in parallel
  shell: "ntfsfix {{ item.device }}"
  with_items: "{{ storage_disks }}"
  when: item.fstype == 'ntfs'
  ignore_errors: yes
  register: ntfsfix_result

- name: Wait for ntfsfix completion
  async_status:
    jid: "{{ item.ansible_job_id }}"
  register: ntfsfix_status
  with_items: "{{ ntfsfix_result.results | default([]) }}"
  when: 
    - ntfsfix_result is defined and item.ansible_job_id is defined
  until: ntfsfix_status.finished
  retries: 30
  delay: 2

- name: Mount NTFS disks with ntfs-3g for write support
  shell: "mount -t ntfs-3g -o remove_hiberfile,force,rw,uid=0,gid=0,umask=000 {{ item.device }} {{ nfs_mount_base }}/{{ item.mountpoint }}"
  with_items: "{{ storage_disks }}"
  when: item.fstype == 'ntfs'
  register: ntfs_mount_result
  ignore_errors: yes

- name: Mount non-NTFS disks
  mount:
    path: "{{ nfs_mount_base }}/{{ item.mountpoint }}"
    src: "{{ item.device }}"
    fstype: "{{ item.fstype | default('auto') }}"
    opts: "defaults,noatime"
    state: mounted
  with_items: "{{ storage_disks }}"
  when: item.fstype != 'ntfs'
  register: other_mount_result
  ignore_errors: yes

- name: Wait for mount operations to complete
  pause:
    seconds: 3

- name: Check mount status
  shell: "mount | grep {{ item.device }} || echo 'Not mounted'"
  with_items: "{{ storage_disks }}"
  register: mount_status
  changed_when: false