---
- name: Install NFS server packages
  package:
    name:
      - nfs-kernel-server
      - ntfs-3g
      - ntfs-3g-dev
    state: present
  register: nfs_install
  async: 300
  poll: 0

- name: Wait for NFS package installation
  async_status:
    jid: "{{ nfs_install.ansible_job_id }}"
  register: nfs_install_result
  until: nfs_install_result.finished
  retries: 30
  delay: 5
  when: nfs_install.ansible_job_id is defined

- name: Display NFS installation status
  debug:
    msg: "{{ 'SUCCESS: NFS server installed' if nfs_install_result is succeeded else 'ERROR: Failed to install NFS server' }}"
  when: nfs_install_result is defined

- name: Create base storage directory
  file:
    path: "{{ nfs_mount_base }}"
    state: directory
    mode: '0777'
    owner: root
    group: root

- name: Unmount any existing mounts
  mount:
    path: "{{ nfs_mount_base }}/{{ item.mountpoint }}"
    state: unmounted
  with_items: "{{ storage_disks }}"
  ignore_errors: yes
  async: 60
  poll: 0

- name: Wait for unmount operations
  wait_for:
    timeout: 2
  delegate_to: localhost
  
- name: Create mount points for disks
  file:
    path: "{{ nfs_mount_base }}/{{ item.mountpoint }}"
    state: directory
    mode: '0777'
    owner: root
    group: root
  with_items: "{{ storage_disks }}"
  async: 60
  poll: 0

- name: Wait for directory creation
  wait_for:
    timeout: 1
  delegate_to: localhost

- name: Run ntfsfix on NTFS partitions in parallel
  shell: "ntfsfix {{ item.device }}"
  with_items: "{{ storage_disks }}"
  when: item.fstype == 'ntfs'
  ignore_errors: yes
  register: ntfsfix_result
  async: 120
  poll: 0

- name: Wait for ntfsfix completion
  async_status:
    jid: "{{ item.ansible_job_id }}"
  register: ntfsfix_status
  with_items: "{{ ntfsfix_result.results | default([]) }}"
  when: ntfsfix_result is defined and item.ansible_job_id is defined
  until: ntfsfix_status.finished
  retries: 30
  delay: 2

- name: Mount NTFS disks with ntfs-3g for write support
  shell: "mount -t ntfs-3g -o remove_hiberfile,force,rw,uid=0,gid=0,umask=000 {{ item.device }} {{ nfs_mount_base }}/{{ item.mountpoint }}"
  with_items: "{{ storage_disks }}"
  when: item.fstype == 'ntfs'
  register: ntfs_mount_result
  ignore_errors: yes
  async: 120
  poll: 0

- name: Mount non-NTFS disks
  mount:
    path: "{{ nfs_mount_base }}/{{ item.mountpoint }}"
    src: "{{ item.device }}"
    fstype: "{{ item.fstype | default('auto') }}"
    opts: "defaults,noatime"
    state: mounted
  with_items: "{{ storage_disks }}"
  when: item.fstype != 'ntfs'
  register: other_mount_result
  ignore_errors: yes
  async: 120
  poll: 0

- name: Wait for mount operations to complete
  wait_for:
    timeout: 3
  delegate_to: localhost

- name: Check mount status
  shell: "mount | grep {{ item.device }} || echo 'Not mounted'"
  with_items: "{{ storage_disks }}"
  register: mount_status
  changed_when: false

- name: Ensure exports file exists
  file:
    path: "{{ nfs_exports_file }}"
    state: touch
    mode: '0644'
    owner: root
    group: root

- name: Configure NFS exports
  blockinfile:
    path: "{{ nfs_exports_file }}"
    marker: "# {mark} ANSIBLE MANAGED BLOCK FOR {{ nfs_client_ip }}"
    block: |
      {% for disk in storage_disks %}
      {{ nfs_mount_base }}/{{ disk.mountpoint }} {{ nfs_client_ip }}({{ nfs_opts }})
      {% endfor %}
    state: present
  register: nfs_config

- name: Start and enable NFS server
  systemd:
    name: nfs-server
    state: restarted
    enabled: yes
  register: nfs_service

- name: Export NFS shares
  command: exportfs -ra
  register: export_result
  retries: "{{ nfs_mount_retries | default(3) }}"
  delay: "{{ nfs_mount_delay | default(2) }}"
  until: export_result is success

- name: Verify exported shares
  command: exportfs -v
  register: export_verification
  changed_when: false

- name: Display exported shares
  debug:
    msg: "Exported NFS shares: {{ export_verification.stdout_lines }}"