---
- name: Install NFS server packages
  package:
    name: nfs-kernel-server
    state: present
  register: nfs_install
  ignore_errors: true

- name: Display NFS installation status
  debug:
    msg: "{{ 'SUCCESS: NFS server installed' if nfs_install.rc == 0 else 'ERROR: Failed to install NFS server' }}"

- name: Configure NFS exports
  template:
    src: exports.j2
    dest: "{{ nfs_exports_file }}"
  register: nfs_config

- name: Display NFS configuration status
  debug:
    msg: "{{ 'SUCCESS: NFS exports configured' if nfs_config.changed else 'ERROR: Failed to configure NFS exports' }}"

- name: Start and enable NFS server
  service:
    name: nfs-kernel-server
    state: restarted
    enabled: yes
  register: nfs_service

- name: Display NFS service status
  debug:
    msg: "{{ 'SUCCESS: NFS service started' if nfs_service.changed else 'ERROR: Failed to start NFS service' }}"

- name: Export NFS shares
  command: exportfs -ra
  register: nfs_export

- name: Display NFS export status
  debug:
    msg: "{{ 'SUCCESS: NFS shares exported' if nfs_export.rc == 0 else 'ERROR: Failed to export NFS shares' }}" 