---
# Безопасная установка и настройка NFS сервера

# Установка NFS сервера
- name: Install NFS server packages
  package:
    name: 
      - nfs-kernel-server
      - ntfs-3g
      - nfs-common
      - portmap
      - nfs4-acl-tools
      - xfsprogs
      - uuid-runtime
    state: present
  register: nfs_server_install

- name: Display NFS server installation status
  debug:
    msg: "{{ 'SUCCESS: NFS server installed' if nfs_server_install is succeeded else 'ERROR: Failed to install NFS server' }}"

# Оптимизация параметров ядра для NFS сервера
- name: Optimize kernel parameters for NFS server
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: yes
    reload: yes
  with_items:
    - { key: "fs.nfs.nlm_tcpport", value: "32768" }
    - { key: "fs.nfs.nlm_udpport", value: "32768" }
    - { key: "sunrpc.tcp_slot_table_entries", value: "128" }
    - { key: "net.core.rmem_default", value: "4194304" }
    - { key: "net.core.wmem_default", value: "4194304" }
    - { key: "net.core.rmem_max", value: "16777216" }
    - { key: "net.core.wmem_max", value: "16777216" }
    - { key: "vm.dirty_ratio", value: "80" }
    - { key: "vm.dirty_background_ratio", value: "5" }
    - { key: "vm.dirty_expire_centisecs", value: "12000" }
    - { key: "net.ipv4.tcp_rmem", value: "4096 87380 16777216" }
    - { key: "net.ipv4.tcp_rmem", value: "4096 87380 16777216" }
    - { key: "net.ipv4.tcp_wmem", value: "4096 65536 16777216" }
    - { key: "net.ipv4.tcp_low_latency", value: "1" }
    - { key: "net.core.netdev_max_backlog", value: "2500" }
  ignore_errors: yes

# Убеждаемся, что службы не замаскированы
- name: Ensure NFS services are not masked
  systemd:
    name: "{{ item }}"
    masked: no
  with_items:
    - nfs-kernel-server
    - rpcbind
  ignore_errors: yes

# Перезапуск сервисов NFS
- name: Restart base services
  systemd:
    name: "{{ item }}"
    state: restarted
    enabled: yes
  with_items:
    - rpcbind
  ignore_errors: yes

# Создаем базовую директорию для хранения данных с правильными правами
- name: Create base storage directory
  file:
    path: "{{ nfs_mount_base }}"
    state: directory
    mode: '0777'
    owner: nobody
    group: nogroup

# Проверка, что storage_disks определен и не пуст
- name: Check if storage_disks is defined
  debug:
    msg: "Storage disks: {{ storage_disks | default([]) }}"
  when: storage_disks is defined and storage_disks | length > 0

# Создание директорий под диски с правильными правами
- name: Create directories for disks with proper permissions
  file:
    path: "{{ nfs_mount_base }}/{{ item.mountpoint }}"
    state: directory
    mode: '0777'
    owner: nobody
    group: nogroup
  with_items: "{{ storage_disks }}"
  when: storage_disks is defined and storage_disks | length > 0

# Создаем скрипт для монтирования дисков по UUID
- name: Create script for mounting disks by UUID
  copy:
    dest: /usr/local/bin/mount-storage-disks.sh
    mode: '0755'
    content: |
      #!/bin/bash
      # Скрипт для монтирования дисков по UUID
      BASE_DIR="{{ nfs_mount_base }}"
      
      # Функция для монтирования диска по UUID
      mount_by_uuid() {
        local uuid=$1
        local mount_point=$2
        
        echo "Проверка диска с UUID: $uuid для монтирования в $mount_point"
        
        # Проверяем, существует ли UUID в системе
        if blkid | grep -q "$uuid"; then
          # Проверяем, смонтирован ли уже диск
          if ! mountpoint -q "$mount_point"; then
            echo "Монтирование $mount_point используя UUID $uuid"
            mount -U "$uuid" "$mount_point"
            
            if [ $? -eq 0 ]; then
              echo "Успешно смонтирован диск с UUID $uuid в $mount_point"
              # Устанавливаем права
              chmod 777 "$mount_point"
              chown nobody:nogroup "$mount_point"
              return 0
            else
              echo "Ошибка монтирования диска с UUID $uuid"
              return 1
            fi
          else
            echo "Точка монтирования $mount_point уже смонтирована"
            return 0
          fi
        else
          echo "UUID $uuid не найден в системе"
          return 1
        fi
      }
      
      # Монтирование известных дисков по UUID
      {% for disk in storage_disks %}
      echo "Обработка диска {{ disk.mountpoint }}"
      mkdir -p "{{ nfs_mount_base }}/{{ disk.mountpoint }}"
      mount_by_uuid "{{ disk.uuid }}" "{{ nfs_mount_base }}/{{ disk.mountpoint }}"
      {% endfor %}
      
      # Проверка результатов монтирования
      echo "Статус монтирования дисков хранения:"
      df -h | grep "{{ nfs_mount_base }}"
      
      exit 0
  when: storage_disks is defined and storage_disks | length > 0

# Создаем systemd сервис для автоматического монтирования
- name: Create systemd service for auto-mounting disks by UUID
  copy:
    dest: /etc/systemd/system/storage-automount.service
    mode: '0644'
    content: |
      [Unit]
      Description=Auto-mount Storage Disks by UUID
      After=local-fs.target
      
      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/mount-storage-disks.sh
      RemainAfterExit=yes
      
      [Install]
      WantedBy=multi-user.target
  when: storage_disks is defined and storage_disks | length > 0

# Активируем и запускаем сервис
- name: Enable and start storage auto-mount service
  systemd:
    name: storage-automount
    state: started
    enabled: yes
    daemon_reload: yes
  ignore_errors: yes
  when: storage_disks is defined and storage_disks | length > 0

# Очищаем все записи в fstab, связанные с нашими дисками
- name: Clean up old fstab entries
  shell: "grep -v '{{ nfs_mount_base }}' /etc/fstab > /tmp/fstab.new && cp /tmp/fstab.new /etc/fstab"
  ignore_errors: yes
  when: storage_disks is defined and storage_disks | length > 0

# Добавляем UUID-монтирование в fstab
- name: Add UUID-based mounts to fstab
  lineinfile:
    path: /etc/fstab
    line: "UUID={{ item.uuid }} {{ nfs_mount_base }}/{{ item.mountpoint }} xfs defaults,noatime,logbufs=8,logbsize=256k,nofail 0 0"
    state: present
  with_items: "{{ storage_disks }}"
  when: storage_disks is defined and storage_disks | length > 0

# Настройка NFS экспортов только если есть диски для экспорта
- name: Configure NFS exports
  template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: root
    mode: '0644'
  register: nfs_exports_config
  when: storage_disks is defined and storage_disks | length > 0

# Настройка более производительного демона NFS
- name: Configure NFS daemon for performance
  template:
    src: nfs.conf.j2
    dest: /etc/nfs.conf
    owner: root
    group: root
    mode: '0644'
  register: nfs_conf_update
  when: storage_disks is defined and storage_disks | length > 0

# Диагностика экспортов
- name: Display exports configuration
  debug:
    msg: "NFS export configuration: {{ lookup('template', 'exports.j2') }}"
  when: storage_disks is defined and storage_disks | length > 0

# Добавление правил в фаервол для NFS
- name: Install iptables if needed
  package:
    name: iptables
    state: present
  ignore_errors: yes

- name: Add firewall rules for NFS
  block:
    - name: Check if iptables is available
      command: which iptables
      register: iptables_check
      ignore_errors: yes
      changed_when: false

    - name: Configure firewall with iptables if available
      shell: |
        iptables -F
        iptables -I INPUT -p tcp --dport 2049 -j ACCEPT
        iptables -I INPUT -p udp --dport 2049 -j ACCEPT
        iptables -I INPUT -p tcp --dport 111 -j ACCEPT
        iptables -I INPUT -p udp --dport 111 -j ACCEPT
        iptables -I INPUT -s {{ nfs_client_ip }} -j ACCEPT
      when: iptables_check.rc == 0
  when: storage_disks is defined and storage_disks | length > 0
  ignore_errors: yes

# Обновляем таблицу экспортов
- name: Update NFS exports
  shell: "exportfs -ra"
  when: storage_disks is defined and storage_disks | length > 0

# Очистка устаревших NFS хендлов
- name: Clean stale NFS handles
  shell: "exportfs -f"
  ignore_errors: yes

# Перезапускаем NFS
- name: Restart NFS server
  systemd:
    name: nfs-kernel-server
    state: restarted
    daemon_reload: yes
  when: storage_disks is defined and storage_disks | length > 0

- name: Ensure NFS server is enabled to start at boot
  systemd:
    name: nfs-kernel-server
    enabled: yes

# Вместо pause используем wait_for, который работает с free-стратегией
- name: Wait for NFS service to be fully up with wait_for
  wait_for:
    path: /proc/fs/nfsd/exports
    timeout: 10
  ignore_errors: yes
  
# Альтернативный метод ожидания, если предыдущий не сработал
- name: Alternative wait using shell command
  shell: "sleep 10"
  changed_when: false
  when: storage_disks is defined and storage_disks | length > 0
  
# Проверка прав доступа к экспортируемым каталогам
- name: Ensure proper permissions on exported directories
  file:
    path: "{{ nfs_mount_base }}/{{ item.mountpoint }}"
    mode: '0777'
    owner: nobody
    group: nogroup
    recurse: yes
  with_items: "{{ storage_disks }}"
  when: storage_disks is defined and storage_disks | length > 0

# Принудительный повторный экспорт всех директорий
- name: Force re-export all directories
  shell: "exportfs -ra"

# Проверка доступности экспортов локально
- name: Verify NFS exports are available
  shell: "showmount -e {{ ansible_default_ipv4.address }} || showmount -e 127.0.0.1 || true"
  register: local_exports
  changed_when: false
  ignore_errors: yes
  
- name: Display exports verification
  debug:
    msg: "Local NFS exports: {{ local_exports.stdout_lines | default(['No exports configured']) }}"

# Верификация экспортов
- name: Verify NFS exports
  shell: "exportfs -v"
  register: exports_verification
  changed_when: false

- name: Display exports verification
  debug:
    msg: "Current NFS exports: {{ exports_verification.stdout_lines | default(['No exports configured']) }}"

# Проверяем, что NFS сервер правильно слушает порты
- name: Check NFS server ports
  shell: "rpcinfo -p | grep -E 'nfs|mountd'"
  register: nfs_ports
  changed_when: false
  failed_when: false

- name: Display NFS ports
  debug:
    msg: "NFS ports: {{ nfs_ports.stdout_lines | default(['NFS service might not be running properly']) }}"