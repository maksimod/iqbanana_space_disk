---
# Основные настройки NFS
nfs_mount_base: /mnt/storage
nfs_exports_file: /etc/exports
nfs_opts: "rw,sync,no_subtree_check,insecure,no_root_squash"

# Настройки монтирования для различных файловых систем
fs_mount_opts:
  ntfs: "remove_hiberfile,force,rw,uid=0,gid=0,umask=000,noatime"
  ext4: "defaults,noatime,data=ordered,commit=60"
  xfs: "defaults,noatime,logbufs=8,logbsize=256k"
  vfat: "defaults,uid=0,gid=0,umask=000,noatime"
  
# Инструменты для работы с файловыми системами
required_packages:
  - ntfs-3g
  - nfs-common
  - nfs-kernel-server
  - nfs4-acl-tools
  - util-linux

# Исключаемые устройства
excluded_devices:
  - /dev/loop
  - /dev/ram
  - /dev/zram
  - /dev/sr

# Оптимизированные параметры монтирования NFS для максимальной производительности
nfs_client_mount_opts: "rw,soft,timeo=10,retrans=2,noatime,_netdev,rsize=1048576,wsize=1048576,nconnect=16,lookupcache=positive,fsc,actimeo=600,nolock,local_lock=none,tcp"

# Параметры сервера NFS для высокой производительности
nfs_server_opts: "rw,sync,no_subtree_check,no_root_squash,insecure,fsid=0,crossmnt,async"

# Дополнительные параметры для повышения надежности монтирования
nfs_mount_timeout: 60
nfs_mount_retries: 5
nfs_mount_delay: 10

# Путь к директории конфигурации backend
backend_config_path: "/home/client/iqbanana_space_disk/backend/config"