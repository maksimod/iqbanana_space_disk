---
# Playbook для автоматического определения и монтирования несистемных дисков через NFS

# Предварительная подготовка системы на всех узлах
- name: System preparation
  hosts: all
  become: yes
  gather_facts: yes
  tasks:
    - name: Unmask any masked services
      systemd:
        name: "{{ item }}"
        masked: no
      loop:
        - nfs-common
        - rpcbind
      ignore_errors: yes

    - name: Ensure essential packages are installed
      package:
        name: 
          - nfs-common
          - rpcbind
          - portmap
        state: present
      register: package_install
      retries: 3
      delay: 5
      until: package_install is success

# Проверка подключения и установка пакетов
- name: Initial setup and verification
  hosts: all
  become: yes
  gather_facts: yes
  tasks:
    - name: Check SSH connection
      ping:
      register: ping_result
      
    - name: Display connection status
      debug:
        msg: "{{ 'SUCCESS: Connected to ' + inventory_hostname if ping_result.ping == 'pong' else 'ERROR: Failed to connect to ' + inventory_hostname }}"
      
    - name: Install required packages
      package:
        name: "{{ required_packages }}"
        state: present
      register: package_install
      retries: 3
      delay: 5
      until: package_install is success

- name: Configure NFS Server
  hosts: nfs_server
  become: yes
  gather_facts: yes
  tasks:
    - name: Set server IP address
      set_fact:
        nfs_server_ip: "{{ ansible_default_ipv4.address }}"
        cacheable: yes

    - name: Set client IP address
      set_fact:
        nfs_client_ip: "{{ hostvars[groups['nfs_client'][0]]['ansible_host'] | default(groups['nfs_client'][0]) }}"
        cacheable: yes

    - name: Create NFS mount base directory
      file:
        path: "{{ nfs_mount_base }}"
        state: directory
        mode: '0777'
        owner: nobody
        group: nogroup
      when: nfs_mount_base is defined

    - name: Include disk detection role
      include_role:
        name: disk_detection
      
    - name: Display found disks
      debug:
        msg: "Storage disks found: {{ storage_disks | default([]) }}"
        
    - name: Skip if no disks found
      meta: end_play
      when: storage_disks is not defined or storage_disks | length == 0

    - name: Include NFS server role
      include_role:
        name: nfs_server

- name: Wait for NFS server to be ready
  hosts: nfs_client
  become: yes
  gather_facts: no
  tasks:
    - name: Wait for NFS server to be ready
      wait_for:
        host: "{{ hostvars[groups['nfs_server'][0]]['nfs_server_ip'] }}"
        port: 2049
        timeout: "{{ nfs_mount_timeout | default(60) }}"
      register: nfs_ready
      retries: 5
      delay: 10
      until: nfs_ready is success
      ignore_errors: yes

    - name: Display NFS server status
      debug:
        msg: "NFS server is {{ 'ready' if nfs_ready is success else 'not ready' }}"

    - name: Wait 15 seconds for NFS server to fully initialize
      pause:
        seconds: 15
      when: nfs_ready is success

- name: Configure NFS Client
  hosts: nfs_client
  become: yes
  gather_facts: yes
  tasks:
    - name: Set server IP address
      set_fact:
        nfs_server_ip: "{{ hostvars[groups['nfs_server'][0]]['nfs_server_ip'] }}"
        cacheable: yes

    - name: Get storage_disks from server
      set_fact:
        storage_disks: "{{ hostvars[groups['nfs_server'][0]]['storage_disks'] | default([]) }}"
        cacheable: yes
      
    - name: Display storage disks to mount
      debug:
        msg: "Storage disks to mount: {{ storage_disks | default([]) }}"

    - name: Skip if no disks found on server
      meta: end_play
      when: storage_disks is not defined or storage_disks | length == 0
        
    - name: Include NFS client role
      include_role:
        name: nfs_client

- name: Verify NFS Setup and Generate Report
  hosts: nfs_client
  become: yes
  gather_facts: no
  tasks:
    - name: Check NFS mounts
      shell: "df -h | grep {{ hostvars[groups['nfs_server'][0]]['nfs_server_ip'] }} || echo 'No mounts found'"
      register: mount_check
      changed_when: false

    - name: Display mount check results
      debug:
        msg: "{{ mount_check.stdout_lines }}"

    - name: Generate detailed report
      include_role:
        name: report