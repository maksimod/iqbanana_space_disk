---
# Playbook для автоматического определения и монтирования несистемных дисков через NFS

# Проверка подключения и установка пакетов
- name: Initial setup and verification
  hosts: all
  become: yes
  gather_facts: yes
  tasks:
    - name: Check SSH connection
      ping:
      register: ping_result
      
    - name: Display connection status
      debug:
        msg: "{{ 'SUCCESS: Connected to ' + inventory_hostname if ping_result.ping == 'pong' else 'ERROR: Failed to connect to ' + inventory_hostname }}"
      
    - name: Install required packages
      package:
        name: "{{ required_packages }}"
        state: present
      register: package_install
      retries: 3
      delay: 5
      until: package_install is success

- name: Configure NFS Server
  hosts: nfs_server
  become: yes
  gather_facts: yes
  tasks:
    - name: Set server IP address
      set_fact:
        nfs_server_ip: "{{ ansible_default_ipv4.address }}"
        cacheable: yes

    - name: Set client IP address
      set_fact:
        nfs_client_ip: "{{ groups['nfs_client'][0] }}"
        cacheable: yes

    - name: Create NFS mount base directory
      file:
        path: "{{ nfs_mount_base }}"
        state: directory
        mode: '0755'
      when: nfs_mount_base is defined

    - name: Include disk detection role
      include_role:
        name: disk_detection

    - name: Include NFS server role
      include_role:
        name: nfs_server

- name: Wait for NFS server to be ready
  hosts: nfs_client
  become: yes
  gather_facts: no
  tasks:
    - name: Wait for NFS server to be ready
      wait_for:
        host: "{{ hostvars[groups['nfs_server'][0]]['nfs_server_ip'] }}"
        port: 2049
        timeout: "{{ nfs_mount_timeout | default(60) }}"
      register: nfs_ready
      retries: 3
      delay: 5
      until: nfs_ready is success
      ignore_errors: yes

    - name: Display NFS server status
      debug:
        msg: "NFS server is {{ 'ready' if nfs_ready is success else 'not ready' }}"

- name: Configure NFS Client
  hosts: nfs_client
  become: yes
  gather_facts: yes
  tasks:
    - name: Set server IP address
      set_fact:
        nfs_server_ip: "{{ hostvars[groups['nfs_server'][0]]['nfs_server_ip'] }}"
        cacheable: yes

    - name: Get storage_disks from server
      set_fact:
        storage_disks: "{{ hostvars[groups['nfs_server'][0]]['storage_disks'] | default([]) }}"
        cacheable: yes

    - name: Include NFS client role
      include_role:
        name: nfs_client

- name: Verify NFS Setup and Generate Report
  hosts: nfs_client
  become: yes
  gather_facts: no
  tasks:
    - name: Check NFS mounts
      shell: "df -h | grep {{ hostvars[groups['nfs_server'][0]]['nfs_server_ip'] }} || echo 'No mounts found'"
      register: mount_check
      changed_when: false

    - name: Display mount check results
      debug:
        msg: "{{ mount_check.stdout_lines }}"

    - name: Generate detailed report
      include_role:
        name: report