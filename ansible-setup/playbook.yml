---
# Playbook для автоматического определения и монтирования несистемных дисков через NFS
# с поддержкой нескольких серверов

# Предварительная подготовка системы на всех узлах
- name: System preparation
  hosts: all
  become: yes
  gather_facts: yes
  vars_files:
    - group_vars/secrets.yml
  tasks:
    - name: Unmask any masked services
      systemd:
        name: "{{ item }}"
        masked: no
      loop:
        - nfs-common
        - rpcbind
      ignore_errors: yes

    - name: Ensure essential packages are installed
      package:
        name: 
          - nfs-common
          - rpcbind
          - portmap
        state: present
      register: package_install
      retries: 3
      delay: 5
      until: package_install is success

# Проверка подключения и установка пакетов
- name: Initial setup and verification
  hosts: all
  become: yes
  gather_facts: yes
  vars_files:
    - group_vars/secrets.yml
  tasks:
    - name: Check SSH connection
      ping:
      register: ping_result
      
    - name: Display connection status
      debug:
        msg: "{{ 'SUCCESS: Connected to ' + inventory_hostname if ping_result.ping == 'pong' else 'ERROR: Failed to connect to ' + inventory_hostname }}"
      
    - name: Install required packages
      package:
        name: "{{ required_packages }}"
        state: present
      register: package_install
      retries: 3
      delay: 5
      until: package_install is success

- name: Configure NFS Servers
  hosts: nfs_servers
  become: yes
  gather_facts: yes
  vars_files:
    - group_vars/secrets.yml
  tasks:
    - name: Set server IP address
      set_fact:
        nfs_server_ip: "{{ ansible_default_ipv4.address }}"
        nfs_server_hostname: "{{ inventory_hostname }}"
        cacheable: yes

    - name: Set client IP address
      set_fact:
        nfs_client_ip: "{{ hostvars[groups['nfs_client'][0]]['ansible_host'] | default(groups['nfs_client'][0]) }}"
        cacheable: yes

    - name: Create NFS mount base directory
      file:
        path: "{{ nfs_mount_base }}"
        state: directory
        mode: '0777'
        owner: nobody
        group: nogroup
      when: nfs_mount_base is defined

    - name: Include disk detection role
      include_role:
        name: disk_detection
      
    - name: Display found disks
      debug:
        msg: "Storage disks found on {{ inventory_hostname }}: {{ storage_disks | default([]) }}"
        
    - name: Skip if no disks found
      meta: end_host
      when: storage_disks is not defined or storage_disks | length == 0

    - name: Include NFS server role
      include_role:
        name: nfs_server

- name: Wait for all NFS servers to be ready
  hosts: nfs_client
  become: yes
  gather_facts: no
  vars_files:
    - group_vars/secrets.yml
  tasks:
    - name: Set fact for server IPs
      set_fact:
        server_ips: "{{ server_ips | default({}) | combine({item: hostvars[item]['nfs_server_ip'] | default(item)}) }}"
      with_items: "{{ groups['nfs_servers'] }}"
      
    - name: Wait for each NFS server to be ready
      wait_for:
        host: "{{ server_ips[item] }}"
        port: 2049
        timeout: "{{ nfs_mount_timeout | default(60) }}"
      register: nfs_ready_results
      retries: 5
      delay: 10
      until: nfs_ready_results is success
      ignore_errors: yes
      with_items: "{{ groups['nfs_servers'] }}"
      
    - name: Save readiness status for each server
      set_fact:
        server_ready_status: "{{ server_ready_status | default({}) | combine({item.item: item.failed | ternary('not ready', 'ready')}) }}"
      with_items: "{{ nfs_ready_results.results }}"
      
    - name: Display NFS servers status
      debug:
        msg: "NFS server {{ item }} is {{ server_ready_status[item] }}"
      with_items: "{{ groups['nfs_servers'] }}"

    # Используем shell вместо pause для совместимости с free-стратегией
    - name: Wait for NFS servers to fully initialize
      shell: "sleep 15"
      changed_when: false

- name: Configure NFS Client
  hosts: nfs_client
  become: yes
  gather_facts: yes
  vars_files:
    - group_vars/secrets.yml
  tasks:
    - name: Initialize all_storage_disks list
      set_fact:
        all_storage_disks: []
        
    - name: Set fact for server IPs
      set_fact:
        server_ips: "{{ server_ips | default({}) | combine({item: hostvars[item]['nfs_server_ip'] | default(item)}) }}"
      with_items: "{{ groups['nfs_servers'] }}"
      
    - name: Collect storage disks from all servers
      set_fact:
        all_storage_disks: "{{ all_storage_disks + [{'server': item, 'server_ip': server_ips[item], 'disks': hostvars[item]['storage_disks'] | default([])}] }}"
      with_items: "{{ groups['nfs_servers'] }}"
      when: hostvars[item]['storage_disks'] is defined and hostvars[item]['storage_disks'] | length > 0
      
    - name: Display all storage disks to mount
      debug:
        msg: "All storage disks to mount: {{ all_storage_disks | default([]) }}"

    - name: Skip if no disks found on any servers
      meta: end_play
      when: all_storage_disks | length == 0
        
    - name: Include NFS client role
      include_role:
        name: nfs_client

- name: Verify NFS Setup and Generate Report
  hosts: nfs_client
  become: yes
  gather_facts: no
  vars_files:
    - group_vars/secrets.yml
  tasks:
    - name: Set fact for server IPs
      set_fact:
        server_ips: "{{ server_ips | default({}) | combine({item: hostvars[item]['nfs_server_ip'] | default(item)}) }}"
      with_items: "{{ groups['nfs_servers'] }}"
      
    - name: Check NFS mounts for all servers
      shell: "df -h | grep -E '{{ server_ips.values() | join('|') }}' || echo 'No mounts found'"
      register: mount_check
      changed_when: false

    - name: Display mount check results
      debug:
        msg: "{{ mount_check.stdout_lines }}"

    - name: Generate detailed report
      include_role:
        name: report