---
# roles/samba/tasks/main.yml
- name: Установка NFS сервера и связанных пакетов
  apt:
    name:
      - nfs-kernel-server
      - nfs-common
      - ntfs-3g
      - fuse
      - ufw
    state: present
    update_cache: yes

- name: Создание директории для точек монтирования
  file:
    path: /mnt
    state: directory
    mode: '0755'

- name: Поиск доступных блочных устройств
  shell: lsblk -rno NAME,TYPE | awk '$2=="part" {print $1}'
  register: available_devices
  changed_when: false

- name: Обработка каждого устройства
  include_tasks: process_device.yml
  vars:
    device_name: "{{ item }}"
  loop: "{{ available_devices.stdout_lines }}"

# Настройка статических портов для NFS
- name: Настройка статических портов NFS в sysctl
  template:
    src: nfs-ports.conf.j2
    dest: /etc/sysctl.d/30-nfs-ports.conf
    owner: root
    group: root
    mode: '0644'
  register: nfs_ports_conf

- name: Применение настроек sysctl
  shell: |
    set +e
    sysctl -p /etc/sysctl.d/30-nfs-ports.conf
    exit 0
  when: nfs_ports_conf.changed
  changed_when: true
  failed_when: false

# Настройка конфигурации NFS сервера
- name: Настройка конфигурации NFS сервера
  template:
    src: nfs-kernel-server.j2
    dest: /etc/default/nfs-kernel-server
    owner: root
    group: root
    mode: '0644'
  register: nfs_config

- name: Создание конфигурации NFS экспорта
  template:
    src: exports.j2
    dest: /etc/exports
  register: exports_config

# Установка прав доступа к точкам монтирования
- name: Установка прав доступа к точкам монтирования
  file:
    path: "/mnt/disk_{{ item }}"
    owner: agger
    group: agger
    mode: '0755'
    state: directory
  loop: "{{ available_devices.stdout_lines }}"
  when: 
    - item | int >= 4
    - "'loop' not in item"
  failed_when: false

# Настройка файрвола для NFS
- name: Открытие портов в UFW для NFS сервиса
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: "{{ 'tcp' if item != '111' else 'any' }}"
  with_items:
    - "111"      # portmapper/rpcbind
    - "2049"     # nfs
    - "32765"    # statd
    - "32766"    # statd outgoing
    - "32767"    # mountd
    - "32768"    # nlm

# Добавляем разрешения для TCP Wrappers
- name: Настройка разрешений в hosts.allow для NFS
  lineinfile:
    path: /etc/hosts.allow
    regexp: "^{{ item }}"
    line: "{{ item }}: 192.168.0.0/24, 127.0.0.1"
    state: present
  with_items:
    - "portmap"
    - "lockd"
    - "mountd"
    - "rquotad"
    - "statd"
    - "nfsd"

- name: Проверка активного статуса UFW
  command: ufw status
  register: ufw_status
  changed_when: false

- name: Включение UFW если неактивен
  command: ufw --force enable
  when: "'inactive' in ufw_status.stdout"

# Перезапуск сервисов NFS в правильном порядке
- name: Перезапуск сервисов NFS
  service:
    name: "{{ item }}"
    state: restarted
    enabled: yes
  loop:
    - rpcbind
    - nfs-kernel-server
  when: nfs_config.changed or exports_config.changed or nfs_ports_conf.changed

# Применение изменений в экспортах
- name: Применение изменений в экспортах
  command: exportfs -rav
  when: exports_config.changed

# Копируем скрипт для ручного монтирования NTFS дисков на сервер agger
- name: Копирование скрипта mount-ntfs-manually.sh
  copy:
    src: "{{ playbook_dir }}/mount-ntfs-manually.sh"
    dest: "/home/agger/mount-ntfs-manually.sh"
    owner: agger
    group: agger
    mode: '0755'

# Копируем скрипт для перезапуска NFS сервера
- name: Копирование скрипта restart-nfs-server.sh
  copy:
    src: "{{ playbook_dir }}/restart-nfs-server.sh"
    dest: "/home/agger/restart-nfs-server.sh"
    owner: agger
    group: agger
    mode: '0755'

# Задачи для установки и настройки Samba

- name: Установка Samba
  apt:
    name:
      - samba
      - samba-common
      - samba-client
    state: present

- name: Создание резервной копии smb.conf
  copy:
    src: /etc/samba/smb.conf
    dest: /etc/samba/smb.conf.bak
    remote_src: yes
    force: no

- name: Настройка smb.conf
  template:
    src: smb.conf.j2
    dest: /etc/samba/smb.conf
    owner: root
    group: root
    mode: '0644'
  notify: restart samba

- name: Открытие портов Samba в firewall
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  with_items:
    - "139"
    - "445"

- name: Запуск и включение Samba
  systemd:
    name: smbd
    state: started
    enabled: yes