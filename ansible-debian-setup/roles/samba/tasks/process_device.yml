---
# roles/samba/tasks/process_device.yml
- name: Получение информации о размере устройства
  shell: blockdev --getsize64 /dev/{{ device_name }} | awk '{printf "%.0f", $1/1024/1024/1024}'
  register: device_size
  changed_when: false
  failed_when: false

- name: Получение информации о типе устройства
  shell: blkid -o value -s TYPE /dev/{{ device_name }} || echo "unknown"
  register: device_type
  changed_when: false
  failed_when: false

- name: Проверка, является ли устройство системным
  shell: |
    for mp in / /boot /var /home /swap.img; do 
      if mountpoint -q $mp && findmnt -n -o SOURCE $mp | grep -q '{{ device_name }}'; then 
        echo "system"
        exit 0
      fi
    done
    echo "not_system"
  register: is_system
  changed_when: false
  failed_when: false

- name: Установка переменных
  set_fact:
    device_size_gb: "{{ device_size.stdout | int }}"
    device_fs_type: "{{ device_type.stdout }}"
    is_system_device: "{{ 'system' in is_system.stdout }}"

- name: Вывод информации об устройстве
  debug:
    msg: "Устройство: /dev/{{ device_name }}, размер: {{ device_size_gb }} GB, тип ФС: {{ device_fs_type }}, системное: {{ is_system_device }}"

- name: Создание точки монтирования
  file:
    path: "/mnt/disk_{{ device_name }}"
    state: directory
    mode: '0755'
  when: 
    - device_size_gb|int >= 4
    - not is_system_device
    - "'loop' not in device_name"

- name: Проверка, смонтировано ли устройство
  shell: mountpoint -q "/mnt/disk_{{ device_name }}" || echo "not_mounted"
  register: is_mounted
  changed_when: false
  failed_when: false
  when: 
    - device_size_gb|int >= 4
    - not is_system_device
    - "'loop' not in device_name"

- name: Монтирование NTFS устройства
  mount:
    path: "/mnt/disk_{{ device_name }}"
    src: "/dev/{{ device_name }}"
    fstype: "{{ device_fs_type }}"
    opts: "defaults,users,rw,uid=agger,gid=agger,umask=000"
    state: mounted
  register: mount_result
  when: 
    - device_size_gb|int >= 4
    - not is_system_device
    - "'loop' not in device_name"
    - "'not_mounted' in is_mounted.stdout|default('')"
    - device_fs_type == "ntfs"
  ignore_errors: yes

- name: Монтирование обычного устройства
  mount:
    path: "/mnt/disk_{{ device_name }}"
    src: "/dev/{{ device_name }}"
    fstype: "{{ device_fs_type }}"
    opts: "defaults"
    state: mounted
  register: mount_result
  when: 
    - device_size_gb|int >= 4
    - not is_system_device
    - "'loop' not in device_name"
    - "'not_mounted' in is_mounted.stdout|default('')"
    - device_fs_type != "ntfs"
  ignore_errors: yes