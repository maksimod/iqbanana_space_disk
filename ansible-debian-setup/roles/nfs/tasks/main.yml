- name: Обнаружение жестких дисков
  script: "{{ playbook_dir }}/scripts/detect_disks.sh"
  register: detect_disks_output
  changed_when: false
  
- name: Создание переменной с настроенными дисками
  set_fact:
    nfs_disks: "{{ detect_disks_output.stdout | from_json }}"

- name: Вывод обнаруженных дисков для NFS
  debug:
    msg: "Обнаружены диски для NFS: {{ nfs_disks | map(attribute='mount_point') | list }}"

- name: Установка и настройка NFS сервера
  block:
    - name: Установка NFS сервера
      apt:
        name:
          - nfs-kernel-server
          - nfs-common
          - rpcbind
        state: present

    - name: Создание директории для шаблонов
      file:
        path: "/etc/default"
        state: directory
        mode: '0755'

    - name: Создание конфигурации nfs-common
      template:
        src: nfs-common.j2
        dest: /etc/default/nfs-common
        mode: '0644'
      notify: restart nfs services

    - name: Создание конфигурации nfs-kernel-server
      template:
        src: nfs-kernel-server.j2
        dest: /etc/default/nfs-kernel-server
        mode: '0644'
      notify: restart nfs services
      
    - name: Настройка статических портов NFS для firewall
      template:
        src: 30-nfs-ports.conf.j2
        dest: /etc/sysctl.d/30-nfs-ports.conf
        mode: '0644'
      register: nfs_ports_config
    
    - name: Настройка оптимизаций производительности NFS
      template:
        src: 90-nfs-performance.conf.j2
        dest: /etc/sysctl.d/90-nfs-performance.conf
        mode: '0644'
      register: nfs_performance_config
      
    - name: Применение настроек sysctl для портов NFS
      command: sysctl -p /etc/sysctl.d/30-nfs-ports.conf
      when: nfs_ports_config.changed
      ignore_errors: yes
      register: sysctl_result
    
    - name: Применение настроек оптимизации NFS
      command: sysctl -p /etc/sysctl.d/90-nfs-performance.conf
      when: nfs_performance_config.changed
      ignore_errors: yes
      register: sysctl_perf_result
      
    - name: Проверка сообщения об ошибке sysctl
      debug:
        msg: "Предупреждение: не удалось применить все настройки sysctl, но плейбук продолжит выполнение."
      when: sysctl_result.failed is defined and sysctl_result.failed or 
            sysctl_perf_result.failed is defined and sysctl_perf_result.failed

    - name: Настройка экспортов NFS с оптимизированными параметрами
      template:
        src: exports.j2
        dest: /etc/exports
        mode: '0644'
      notify: restart nfs services

    - name: Настройка доступа к NFS для клиентов
      template:
        src: hosts.allow.j2
        dest: /etc/hosts.allow
        mode: '0644'
      notify: restart nfs services

    - name: Убедиться, что сервисы NFS запущены и включены
      systemd:
        name: "{{ item }}"
        state: started
        enabled: yes
      with_items:
        - rpcbind
        - nfs-kernel-server
      
    - name: Применение настроек экспорта
      command: exportfs -ra
      changed_when: true
      
    - name: Проверка статуса экспортов NFS
      command: exportfs -v
      register: nfs_exports_status
      changed_when: false
      
    - name: Вывод статуса экспортов NFS
      debug:
        var: nfs_exports_status.stdout_lines
        
    - name: Открытие портов в firewall
      ufw:
        rule: allow
        port: "{{ item }}"
        proto: "{{ 'tcp' if item != '111' else 'any' }}"
      with_items:
        - "111"        # rpcbind
        - "2049"       # nfs
        - "32765"      # statd
        - "32766"      # statd outgoing
        - "32767"      # mountd
        - "32768"      # lockd
      when: ansible_os_family == "Debian"
      
    - name: Перезагрузка UFW
      command: ufw reload
      changed_when: true
      when: ansible_os_family == "Debian"
      
  become: true
  when: "'agger' in inventory_hostname"
  
- name: Настройка клиента NFS на apper с оптимизацией
  block:
    - name: Установка NFS клиента
      apt:
        name:
          - nfs-common
          - rpcbind
        state: present
        
    - name: Убедиться, что rpcbind запущен и включен
      systemd:
        name: rpcbind
        state: started
        enabled: yes
    
    - name: Настройка оптимизаций производительности NFS для клиента
      template:
        src: 90-nfs-performance.conf.j2
        dest: /etc/sysctl.d/90-nfs-performance.conf
        mode: '0644'
      register: nfs_client_performance_config
    
    - name: Применение настроек оптимизации NFS для клиента
      command: sysctl -p /etc/sysctl.d/90-nfs-performance.conf
      when: nfs_client_performance_config.changed
      ignore_errors: yes
        
    - name: Создание директорий для монтирования
      file:
        path: "/mnt/{{ item.directory_name }}"
        state: directory
        mode: '0755'
      loop: "{{ nfs_disks }}"
      loop_control:
        label: "{{ item.directory_name }}"
    
    - name: Создание или обновление записей в /etc/fstab
      blockinfile:
        path: /etc/fstab
        backup: yes
        marker: "# {mark} ANSIBLE MANAGED BLOCK FOR NFS MOUNTS"
        block: |
          {% for disk in nfs_disks %}
          agger:{{ disk.mount_point }} /mnt/{{ disk.directory_name }} nfs rw,vers=3,proto=tcp,rsize=1048576,wsize=1048576,async,noatime,nodiratime,actimeo=120,_netdev,soft,timeo=100 0 0
          {% endfor %}
      register: fstab_updated
    
    - name: Перемонтирование точек монтирования
      command: mount -a
      when: fstab_updated.changed
      ignore_errors: yes
  
  become: true
  when: "'apper' in inventory_hostname" 