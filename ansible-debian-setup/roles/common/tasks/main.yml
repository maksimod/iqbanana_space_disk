---
# roles/common/tasks/main.yml
- name: Обновление списка пакетов
  apt:
    update_cache: yes
  become: yes

- name: Установка python3
  apt:
    name: python3
    state: present
  become: yes

- name: Установка python3-pip
  apt:
    name: python3-pip
    state: present
  become: yes

- name: Установка nano
  apt:
    name: nano
    state: present
  become: yes

- name: Установка samba
  apt:
    name: samba
    state: present
  become: yes

# Общие задачи для всех серверов

- name: Обновление кэша пакетов
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Установка базовых пакетов
  apt:
    name:
      - vim
      - mc
      - htop
      - iftop
      - sudo
      - rsync
      - curl
      - wget
      - nmap
      - net-tools
      - ufw
    state: present

- name: Установка правильного времени
  block:
    - name: Установка NTP
      apt:
        name: ntp
        state: present

    - name: Запуск и включение сервиса NTP
      systemd:
        name: ntp
        state: started
        enabled: yes
        
- name: Настройка UFW
  block:
    - name: Настройка правил по умолчанию
      ufw:
        direction: "{{ item.direction }}"
        policy: "{{ item.policy }}"
      with_items:
        - { direction: 'incoming', policy: 'deny' }
        - { direction: 'outgoing', policy: 'allow' }

    - name: Разрешение SSH
      ufw:
        rule: allow
        port: 22
        proto: tcp

    - name: Включение UFW
      ufw:
        state: enabled
