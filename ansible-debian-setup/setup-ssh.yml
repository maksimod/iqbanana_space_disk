---
# Плейбук для автоматической настройки SSH ключей
- name: Настройка SSH ключей для беспарольного доступа
  hosts: localhost
  gather_facts: no
  become: false
  
  vars:
    temp_file: "/tmp/sshpass_{{ lookup('pipe', 'date +%s') }}.txt"
  
  vars_prompt:
    - name: agger_password
      prompt: "Введите пароль для пользователя agger на сервере agger (192.168.0.104)"
      private: yes
  
  tasks:
    - name: Проверка наличия SSH ключа
      stat:
        path: "~/.ssh/id_rsa"
      register: ssh_key
      become: false
      
    - name: Генерация SSH ключа если он отсутствует
      shell: ssh-keygen -t rsa -b 4096 -f ~/.ssh/id_rsa -N ""
      when: not ssh_key.stat.exists
      become: false
      
    - name: Создание временного sshpass файла
      copy:
        content: "{{ agger_password }}"
        dest: "{{ temp_file }}"
        mode: '0600'
      become: false
      
    - name: Копирование SSH ключа на сервер agger
      shell: sshpass -f "{{ temp_file }}" ssh-copy-id -o StrictHostKeyChecking=no agger@192.168.0.104
      register: copy_result
      failed_when: false
      become: false
      
    - name: Удаление временного файла пароля
      file:
        path: "{{ temp_file }}"
        state: absent
      become: false
      
    - name: Показать результат операции
      debug:
        msg: "{{ copy_result.stdout_lines }}"
      
    - name: Проверка успешности копирования ключа
      fail:
        msg: "Не удалось скопировать SSH ключ. Проверьте пароль и доступность сервера. Ошибка: {{ copy_result.stderr }}"
      when: copy_result.rc != 0
      become: false

    - name: Обновление файла hosts для использования ключей
      replace:
        path: "{{ playbook_dir }}/hosts"
        regexp: 'ansible_ssh_pass=.*ansible_ssh_common_args'
        replace: 'ansible_ssh_common_args'
      become: false
      when: copy_result.rc == 0
      
    - name: Успешное завершение
      debug:
        msg: "SSH ключи успешно настроены. Теперь можно запустить основной плейбук без пароля."
      become: false
      when: copy_result.rc == 0 