# Preseed file for fully unattended Debian installation on /dev/sdb

# Главная настройка для полностью автоматической установки
d-i auto-install/enabled boolean true
d-i debconf/priority select critical

# Locale settings
d-i debian-installer/language string en
d-i debian-installer/country string US
d-i debian-installer/locale string en_US.UTF-8
d-i localechooser/preferred-locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us

# ВАЖНО: Сетевые настройки, которые должны полностью пропустить интерактивность
# Опция forcepriority критически важна - она заставляет принять все значения по умолчанию
debconf debconf/priority string critical
d-i netcfg/choose_interface select auto
d-i netcfg/wireless_wep string
d-i netcfg/dhcp_failed note
d-i netcfg/dhcp_options select Configure network manually
d-i netcfg/get_hostname string debian-server
d-i netcfg/get_domain string localdomain
d-i netcfg/get_nameservers string 8.8.8.8
d-i netcfg/get_ipaddress string 192.168.0.104
d-i netcfg/get_netmask string 255.255.255.0
d-i netcfg/get_gateway string 192.168.0.1
d-i netcfg/confirm_static boolean true

# Принудительно устанавливаем, что эти настройки уже были видны пользователю
d-i netcfg/hostname seen true
d-i netcfg/get_hostname seen true
d-i netcfg/get_domain seen true
d-i netcfg/dhcp_options seen true
d-i netcfg/get_ipaddress seen true
d-i netcfg/get_netmask seen true
d-i netcfg/get_gateway seen true
d-i netcfg/confirm_static seen true

# Раннее установка hostname
d-i preseed/early_command string \
  echo debian-server > /etc/hostname; \
  echo "127.0.0.1 debian-server" > /etc/hosts; \
  echo "192.168.0.104 debian-server" >> /etc/hosts

# User configuration
d-i passwd/root-login boolean true
d-i passwd/root-password password rootpassword
d-i passwd/root-password-again password rootpassword
d-i passwd/root-password seen true
d-i passwd/root-password-again seen true

d-i passwd/user-fullname string Server User
d-i passwd/username string server
d-i passwd/user-password password userpassword
d-i passwd/user-password-again password userpassword
d-i passwd/user-password seen true
d-i passwd/user-password-again seen true
d-i user-setup/allow-password-weak boolean true

# Timezone
d-i time/zone string UTC
d-i clock-setup/utc boolean true
d-i clock-setup/ntp boolean true

# Mirror settings
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string
d-i mirror/suite string stable

# Partitioning: Fully automated on /dev/sdb
d-i partman/early_command string debconf-set partman-auto/disk "$(list-devices disk | grep sdb | head -n1)"
d-i partman-auto/method string regular
d-i partman-auto/disk string /dev/sdb
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true

# Очистка диска перед разметкой
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman/confirm seen true
d-i partman/confirm_nooverwrite seen true

# Кастомная схема разметки: корневой раздел (/) и swap
d-i partman-auto/expert_recipe string                         \
      boot-root ::                                            \
              500 10000 1000000 ext4                         \
                  $primary{ } $bootable{ }                   \
                  method{ format } format{ }                 \
                  use_filesystem{ } filesystem{ ext4 }       \
                  mountpoint{ / }                            \
              .                                              \
              512 1024 1024 linux-swap                      \
                  $primary{ }                                \
                  method{ swap } format{ }                   \
              .

# Указываем файловую систему по умолчанию
d-i partman/default_filesystem string ext4

# Package selection
tasksel tasksel/first multiselect standard, ssh-server
d-i tasksel/desktop multiselect
d-i tasksel/skip-tasks string desktop
d-i tasksel/skip-tasks string gnome-desktop

# Отключение установки рекомендуемых пакетов
d-i base-installer/install-recommends boolean false

# Список пакетов для установки
d-i pkgsel/include string vim git sudo openssh-server python3 ansible
d-i pkgsel/upgrade select full-upgrade
d-i pkgsel/update-policy select unattended-upgrades

# Пропускаем настройку APT
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/use_mirror boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org

# Предотвращение запросов CD/DVD
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/cdrom/set-next boolean false
d-i apt-setup/cdrom/set-failed boolean false

# Пропуск настройки Popularity Contest
d-i popularity-contest/participate boolean false

# Установить и настроить sudo для пользователя server
d-i preseed/late_command string \
    echo debian-server > /target/etc/hostname ; \
    echo "127.0.0.1 debian-server" > /target/etc/hosts ; \
    echo "192.168.0.104 debian-server" >> /target/etc/hosts ; \
    echo 'server ALL=(ALL:ALL) NOPASSWD:ALL' > /target/etc/sudoers.d/server ; \
    chmod 0440 /target/etc/sudoers.d/server ; \
    sed -i 's/#PermitRootLogin prohibit-password/PermitRootLogin yes/' /target/etc/ssh/sshd_config ; \
    sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /target/etc/ssh/sshd_config ; \
    mkdir -p /target/home/server/.ssh ; \
    chmod 700 /target/home/server/.ssh ; \
    chown server:server /target/home/server/.ssh ; \
    in-target systemctl enable ssh ; \
    in-target apt-get update ; \
    in-target apt-get install -y sudo openssh-server ; \
    # Настройка сетевого интерфейса со статическим IP \
    echo "# Статическая конфигурация сети" > /target/etc/network/interfaces.d/setup ; \
    echo "auto eth0" >> /target/etc/network/interfaces.d/setup ; \
    echo "iface eth0 inet static" >> /target/etc/network/interfaces.d/setup ; \
    echo "  address 192.168.0.104" >> /target/etc/network/interfaces.d/setup ; \
    echo "  netmask 255.255.255.0" >> /target/etc/network/interfaces.d/setup ; \
    echo "  gateway 192.168.0.1" >> /target/etc/network/interfaces.d/setup ; \
    echo "  dns-nameservers 8.8.8.8" >> /target/etc/network/interfaces.d/setup

# Automate GRUB installation on /dev/sdb
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string /dev/sdb
d-i grub-installer/bootdev seen true

# Finish installation
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean false

# Отключение финальных вопросов
d-i debian-installer/exit/halt boolean false
d-i debian-installer/exit/poweroff boolean false

# Предотвращение финальных запросов
d-i finish-install/keep-consoles boolean false
d-i finish-install/reboot_in_progress note

# Критично для предотвращения запросов
d-i preseed/interactive boolean false

# Подавление всех предупреждений
d-i hw-detect/load_firmware boolean true